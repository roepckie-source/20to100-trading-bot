name: Bitrue V5 - Long vs Short

on:
  workflow_dispatch:

jobs:
  v5-direction-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Download BTC data
        env:
          BITRUE_DAYS: "365"
        run: |
          python bitrue/download_binance_data.py

      - name: Validate dataset
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("BTCUSDT_5m.csv")

          print("=" * 60)
          print("V5 DATA VALIDATION")
          print("=" * 60)

          print(f"Rows: {len(df):,}")
          print(f"Columns: {list(df.columns)}")

          assert len(df) > 100000, "Dataset unexpectedly small"

          print("Dataset validation: PASS")
          PY

      - name: Run V5 direction test
        run: |
          python bitrue/v5_direction_test.py

      - name: Show V5 report
        run: |
          echo "=========================================="
          echo "V5 DIRECTION REPORT"
          echo "=========================================="
          cat bitrue_v5_direction_report.txt

      - name: Show V5 summary
        run: |
          echo "=========================================="
          echo "V5 SUMMARY CSV"
          echo "=========================================="
          cat bitrue_v5_direction_summary.csv

      - name: Upload V5 results
        uses: actions/upload-artifact@v4
        with:
          name: bitrue-v5-direction-results
          path: |
            bitrue_v5_direction_report.txt
            bitrue_v5_direction_summary.csv
            bitrue_v5_long_only_trades.csv
            bitrue_v5_short_only_trades.csv
            bitrue_v5_both_trades.csv
            BTCUSDT_5m.csv

      - name: Final status
        run: |
          echo "=========================================="
          echo "BITRUE V5 COMPLETE"
          echo "=========================================="
          echo "LONG ONLY:  TESTED"
          echo "SHORT ONLY: TESTED"
          echo "BOTH:       TESTED"
          echo ""
          echo "PAPER ONLY"
          echo "NO LIVE TRADING"
          echo "NO API KEYS"
          echo "NO WALLET"
          echo "NO REAL ORDERS"

name: 20to100 Backtest

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 5 * * *"


jobs:

  backtest:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            ccxt


      # ==========================================================
      # 4. DIRECTORIES
      # ==========================================================

      - name: Create directories
        run: |

          mkdir -p data
          mkdir -p logs
          mkdir -p /tmp/binance_data


      # ==========================================================
      # 5. DOWNLOAD BINANCE PUBLIC DATA
      #
      # Official archive:
      #
      # https://data.binance.vision
      #
      # 3 years
      # BTCUSDT
      # ETHUSDT
      # SOLUSDT
      # 5 minute candles
      #
      # Monthly archives are used for completed months.
      # Daily archives are used for the current month.
      #
      # ==========================================================

      - name: Download historical data
        run: |

          python <<'PY'

          import os
          import io
          import zipfile
          import requests
          import pandas as pd

          from datetime import date, datetime, timedelta


          # ======================================================
          # CONFIG
          # ======================================================

          BASE_URL = (
              "https://data.binance.vision/"
              "data/spot"
          )

          INTERVAL = "5m"

          SYMBOLS = {
              "BTCUSDT": "data/BTC_USDT_5m.csv",
              "ETHUSDT": "data/ETH_USDT_5m.csv",
              "SOLUSDT": "data/SOL_USDT_5m.csv",
          }

          YEARS_BACK = 3


          # ======================================================
          # DATE RANGE
          # ======================================================

          today = date.today()

          start_date = date(
              today.year - YEARS_BACK,
              today.month,
              today.day
          )

          yesterday = today - timedelta(days=1)

          print()
          print("=" * 70)
          print("BINANCE PUBLIC DATA DOWNLOAD")
          print("=" * 70)
          print()
          print(f"Start date : {start_date}")
          print(f"End date   : {yesterday}")
          print(f"Interval   : {INTERVAL}")
          print("Assets     : BTC + ETH + SOL")
          print("=" * 70)


          # ======================================================
          # HTTP SESSION
          # ======================================================

          session = requests.Session()

          session.headers.update({
              "User-Agent": "20to100-trading-bot/1.0"
          })


          # ======================================================
          # DOWNLOAD FUNCTION
          # ======================================================

          def download_zip(url):

              print(f"DOWNLOAD: {url}")

              response = session.get(
                  url,
                  timeout=60
              )

              if response.status_code == 404:

                  return None

              response.raise_for_status()

              return response.content


          # ======================================================
          # READ ZIP
          # ======================================================

          def read_zip(content):

              if content is None:
                  return None

              with zipfile.ZipFile(
                  io.BytesIO(content)
              ) as z:

                  names = z.namelist()

                  csv_files = [
                      name
                      for name in names
                      if name.lower().endswith(".csv")
                  ]

                  if not csv_files:
                      raise RuntimeError(
                          "ZIP enthält keine CSV-Datei."
                      )

                  csv_name = csv_files[0]

                  with z.open(csv_name) as f:

                      df = pd.read_csv(
                          f,
                          header=None
                      )

              return df


          # ======================================================
          # BINANCE COLUMN NAMES
          #
          # Binance spot kline format:
          #
          # 0 Open time
          # 1 Open
          # 2 High
          # 3 Low
          # 4 Close
          # 5 Volume
          # 6 Close time
          # 7 Quote asset volume
          # 8 Number of trades
          # 9 Taker buy base volume
          # 10 Taker buy quote volume
          # 11 Ignore
          #
          # ======================================================

          COLUMNS = [
              "open_time",
              "open",
              "high",
              "low",
              "close",
              "volume",
              "close_time",
              "quote_volume",
              "trades",
              "taker_buy_base",
              "taker_buy_quote",
              "ignore",
          ]


          # ======================================================
          # MONTH ITERATOR
          # ======================================================

          def month_iterator(start, end):

              current = date(
                  start.year,
                  start.month,
                  1
              )

              end_month = date(
                  end.year,
                  end.month,
                  1
              )

              while current <= end_month:

                  yield current

                  if current.month == 12:

                      current = date(
                          current.year + 1,
                          1,
                          1
                      )

                  else:

                      current = date(
                          current.year,
                          current.month + 1,
                          1
                      )


          # ======================================================
          # DOWNLOAD ONE SYMBOL
          # ======================================================

          def download_symbol(
              symbol,
              output_file
          ):

              print()
              print("=" * 70)
              print(f"PROCESSING {symbol}")
              print("=" * 70)

              frames = []

              monthly_count = 0
              daily_count = 0

              # --------------------------------------------------
              # COMPLETED MONTHS
              # --------------------------------------------------

              first_month = date(
                  start_date.year,
                  start_date.month,
                  1
              )

              current_month = date(
                  today.year,
                  today.month,
                  1
              )

              # Only completed months
              last_completed_month = date(
                  current_month.year,
                  current_month.month,
                  1
              )

              # Move one month backwards
              if last_completed_month.month == 1:

                  last_completed_month = date(
                      last_completed_month.year - 1,
                      12,
                      1
                  )

              else:

                  last_completed_month = date(
                      last_completed_month.year,
                      last_completed_month.month - 1,
                      1
                  )


              for month in month_iterator(
                  first_month,
                  last_completed_month
              ):

                  year = month.year
                  month_number = f"{month.month:02d}"

                  filename = (
                      f"{symbol}-"
                      f"{INTERVAL}-"
                      f"{year}-"
                      f"{month_number}.zip"
                  )

                  url = (
                      f"{BASE_URL}/monthly/klines/"
                      f"{symbol}/{INTERVAL}/"
                      f"{filename}"
                  )

                  content = download_zip(url)

                  if content is None:

                      raise RuntimeError(
                          f"FEHLER: Monatsdatei fehlt:\n{url}"
                      )

                  df = read_zip(content)

                  if df is None or df.empty:

                      raise RuntimeError(
                          f"Leere Monatsdatei: {url}"
                      )

                  df.columns = COLUMNS

                  frames.append(df)

                  monthly_count += 1

                  print(
                      f"{symbol}: "
                      f"MONTH {year}-{month_number} "
                      f"-> {len(df):,} rows"
                  )


              # --------------------------------------------------
              # CURRENT MONTH
              #
              # Monthly archive does not contain the
              # incomplete current month.
              #
              # Therefore download daily files.
              # --------------------------------------------------

              current_day = date(
                  today.year,
                  today.month,
                  1
              )

              day = current_day

              while day <= yesterday:

                  # Only days inside requested range
                  if day < start_date:

                      day += timedelta(days=1)
                      continue

                  filename = (
                      f"{symbol}-"
                      f"{INTERVAL}-"
                      f"{day.year}-"
                      f"{day.month:02d}-"
                      f"{day.day:02d}.zip"
                  )

                  url = (
                      f"{BASE_URL}/daily/klines/"
                      f"{symbol}/{INTERVAL}/"
                      f"{filename}"
                  )

                  content = download_zip(url)

                  if content is None:

                      print(
                          f"{symbol}: "
                          f"NO DAILY FILE: {day}"
                      )

                      day += timedelta(days=1)

                      continue

                  df = read_zip(content)

                  if df is not None and not df.empty:

                      df.columns = COLUMNS

                      frames.append(df)

                      daily_count += 1

                      print(
                          f"{symbol}: "
                          f"DAY {day} "
                          f"-> {len(df):,} rows"
                      )

                  day += timedelta(days=1)


              # --------------------------------------------------
              # COMBINE
              # --------------------------------------------------

              if not frames:

                  raise RuntimeError(
                      f"{symbol}: keine Daten gefunden."
                  )

              df = pd.concat(
                  frames,
                  ignore_index=True
              )


              # --------------------------------------------------
              # TIMESTAMP NORMALIZATION
              #
              # Binance Spot:
              # 2025+ may use microseconds.
              #
              # We normalize everything to milliseconds.
              # --------------------------------------------------

              df["open_time"] = pd.to_numeric(
                  df["open_time"],
                  errors="coerce"
              )

              df = df.dropna(
                  subset=["open_time"]
              )

              # Microseconds:
              # around 1.7e15
              #
              # Milliseconds:
              # around 1.7e12

              microsecond_mask = (
                  df["open_time"] > 10**14
              )

              df.loc[
                  microsecond_mask,
                  "open_time"
              ] = (
                  df.loc[
                      microsecond_mask,
                      "open_time"
                  ] / 1000
              )


              df["open_time"] = (
                  df["open_time"]
                  .astype("int64")
              )


              # --------------------------------------------------
              # NUMERIC COLUMNS
              # --------------------------------------------------

              numeric_columns = [
                  "open",
                  "high",
                  "low",
                  "close",
                  "volume",
              ]

              for column in numeric_columns:

                  df[column] = pd.to_numeric(
                      df[column],
                      errors="coerce"
                  )


              # --------------------------------------------------
              # FILTER DATE RANGE
              # --------------------------------------------------

              start_timestamp = int(
                  pd.Timestamp(
                      start_date,
                      tz="UTC"
                  ).timestamp() * 1000
              )

              end_timestamp = int(
                  pd.Timestamp(
                      today,
                      tz="UTC"
                  ).timestamp() * 1000
              )

              df = df[
                  (df["open_time"] >= start_timestamp)
                  &
                  (df["open_time"] < end_timestamp)
              ]


              # --------------------------------------------------
              # REMOVE DUPLICATES
              # --------------------------------------------------

              df = df.drop_duplicates(
                  subset=["open_time"]
              )


              # --------------------------------------------------
              # SORT
              # --------------------------------------------------

              df = df.sort_values(
                  "open_time"
              )


              # --------------------------------------------------
              # FINAL COLUMNS
              #
              # This matches the format expected by
              # the existing trading bot.
              # --------------------------------------------------

              output = df[
                  [
                      "open_time",
                      "open",
                      "high",
                      "low",
                      "close",
                      "volume",
                  ]
              ].copy()


              output = output.rename(
                  columns={
                      "open_time": "timestamp"
                  }
              )


              # --------------------------------------------------
              # WRITE CSV
              # --------------------------------------------------

              output.to_csv(
                  output_file,
                  index=False
              )


              # --------------------------------------------------
              # REPORT
              # --------------------------------------------------

              print()
              print(
                  f"{symbol}: DOWNLOAD COMPLETE"
              )

              print(
                  f"{symbol}: "
                  f"Monthly files: {monthly_count}"
              )

              print(
                  f"{symbol}: "
                  f"Daily files: {daily_count}"
              )

              print(
                  f"{symbol}: "
                  f"Rows: {len(output):,}"
              )

              print(
                  f"{symbol}: "
                  f"Output: {output_file}"
              )

              print(
                  f"{symbol}: "
                  f"Start: "
                  f"{pd.to_datetime(output['timestamp'].min(), unit='ms', utc=True)}"
              )

              print(
                  f"{symbol}: "
                  f"End: "
                  f"{pd.to_datetime(output['timestamp'].max(), unit='ms', utc=True)}"
              )

              return len(output)


          # ======================================================
          # DOWNLOAD ALL SYMBOLS
          # ======================================================

          results = {}

          for symbol, output_file in SYMBOLS.items():

              results[symbol] = download_symbol(
                  symbol,
                  output_file
              )


          # ======================================================
          # FINAL REPORT
          # ======================================================

          print()
          print("=" * 70)
          print("ALL DATA DOWNLOADS COMPLETE")
          print("=" * 70)

          for symbol, rows in results.items():

              print(
                  f"{symbol}: {rows:,} candles"
              )

          print("=" * 70)

          PY


      # ==========================================================
      # 6. VERIFY DATA
      #
      # VERY IMPORTANT:
      # If this fails, NO BACKTEST is started.
      # ==========================================================

      - name: Verify historical data
        run: |

          echo "=================================================="
          echo "VERIFYING HISTORICAL DATA"
          echo "=================================================="


          for file in \
            data/BTC_USDT_5m.csv \
            data/ETH_USDT_5m.csv \
            data/SOL_USDT_5m.csv
          do

            echo
            echo "----------------------------------------------"
            echo "FILE: $file"
            echo "----------------------------------------------"


            if [ ! -f "$file" ]; then

              echo "ERROR: FILE DOES NOT EXIST"
              echo "$file"

              exit 1

            fi


            rows=$(($(wc -l < "$file") - 1))


            echo "Rows: $rows"


            if [ "$rows" -lt 250000 ]; then

              echo
              echo "ERROR: INSUFFICIENT DATA"
              echo "Required: >= 250000 candles"
              echo "Found: $rows"

              exit 1

            fi


            echo
            echo "First rows:"
            head -n 3 "$file"


            echo
            echo "Last rows:"
            tail -n 3 "$file"


            echo
            echo "OK: $file"

          done


          echo
          echo "=================================================="
          echo "ALL DATA FILES VERIFIED"
          echo "=================================================="


      # ==========================================================
      # 7. FINAL DATA REPORT
      # ==========================================================

      - name: Final data report
        run: |

          echo "=================================================="
          echo "FINAL DATA REPORT"
          echo "=================================================="


          python <<'PY'

          import pandas as pd
          from pathlib import Path


          files = [
              Path("data/BTC_USDT_5m.csv"),
              Path("data/ETH_USDT_5m.csv"),
              Path("data/SOL_USDT_5m.csv"),
          ]


          for path in files:

              print()
              print("=" * 60)
              print(path)
              print("=" * 60)

              df = pd.read_csv(path)

              print(
                  "Rows:",
                  f"{len(df):,}"
              )

              print(
                  "Columns:",
                  list(df.columns)
              )

              print(
                  "Start:",
                  pd.to_datetime(
                      df["timestamp"].min(),
                      unit="ms",
                      utc=True
                  )
              )

              print(
                  "End:",
                  pd.to_datetime(
                      df["timestamp"].max(),
                      unit="ms",
                      utc=True
                  )
              )

              print(
                  "Duplicate timestamps:",
                  df["timestamp"].duplicated().sum()
              )

              print(
                  "Missing close:",
                  df["close"].isna().sum()
              )


          print()
          print("=" * 60)
          print("DATA REPORT COMPLETE")
          print("=" * 60)

          PY


      # ==========================================================
      # 8. V6 BACKTEST
      #
      # No "always".
      # Only runs if data verification succeeded.
      # ==========================================================

      - name: Run V6 backtest
        run: |

          echo "=================================================="
          echo "RUNNING V6 BACKTEST"
          echo "=================================================="

          python v6_backtest.py


      # ==========================================================
      # 9. V6-C STRESS TEST
      # ==========================================================

      - name: Run V6-C stress test
        run: |

          echo "=================================================="
          echo "RUNNING V6-C STRESS TEST"
          echo "=================================================="

          python v6_c_stress.py


      # ==========================================================
      # 10. V6-C MONTE CARLO
      # ==========================================================

      - name: Run V6-C Monte Carlo
        run: |

          echo "=================================================="
          echo "RUNNING V6-C MONTE CARLO"
          echo "=================================================="

          python v6_c_monte_carlo.py


      # ==========================================================
      # 11. V7-S0
      # ==========================================================

      - name: Run V7-S0 survival backtest
        run: |

          echo "=================================================="
          echo "RUNNING V7-S0 SURVIVAL BACKTEST"
          echo "=================================================="

          python v7_survival_backtest.py


      # ==========================================================
      # 12. V7-S1
      # ==========================================================

      - name: Run V7-S1 backtest
        run: |

          echo "=================================================="
          echo "RUNNING V7-S1 BACKTEST"
          echo "=================================================="

          python v7_s1_backtest.py


      # ==========================================================
      # 13. SHOW RESULTS
      # ==========================================================

      - name: Show results
        if: always()
        run: |

          echo "=================================================="
          echo "RESULT FILES"
          echo "=================================================="


          echo
          echo "CSV files:"

          find . -type f \
            \( \
              -name "*.csv" \
              -o -name "*.json" \
            \) \
            -print \
            | sort


          echo
          echo "Logs:"

          find logs \
            -type f \
            -print \
            2>/dev/null || true


      # ==========================================================
      # 14. UPLOAD ARTIFACTS
      # ==========================================================

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: backtest-results

          path: |
            data/*.csv
            *.csv
            *.json
            logs/**

          if-no-files-found: warn

          retention-days: 14

name: 20to100 Backtest

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 5 * * *"


jobs:

  backtest:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            ccxt


      # =====================================================
      # DATA DIRECTORY
      # =====================================================

      - name: Create data directory
        run: |
          mkdir -p data


      # =====================================================
      # DOWNLOAD BTC
      # =====================================================

      - name: Download BTC 5m data
        run: |
          python - <<'PY'
          import ccxt
          import pandas as pd
          import time
          from pathlib import Path

          exchange = ccxt.binance()

          symbol = "BTC/USDT"

          timeframe = "5m"

          since = exchange.parse8601(
              "2021-01-01T00:00:00Z"
          )

          end = exchange.milliseconds()

          all_rows = []

          print("Downloading BTC/USDT 5m data...")

          while since < end:

              try:

                  rows = exchange.fetch_ohlcv(
                      symbol,
                      timeframe=timeframe,
                      since=since,
                      limit=1000
                  )

              except Exception as exc:

                  print(
                      f"Download error: {exc}"
                  )

                  time.sleep(5)

                  continue

              if not rows:
                  break

              all_rows.extend(rows)

              since = rows[-1][0] + 5 * 60 * 1000

              print(
                  f"BTC rows: {len(all_rows):,}"
              )

              time.sleep(
                  exchange.rateLimit / 1000
              )

          df = pd.DataFrame(
              all_rows,
              columns=[
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
                  "volume"
              ]
          )

          df["timestamp"] = pd.to_datetime(
              df["timestamp"],
              unit="ms",
              utc=True
          )

          df = df.drop_duplicates(
              subset=["timestamp"]
          )

          df = df.sort_values(
              "timestamp"
          )

          path = Path(
              "data/BTC_USDT_5m.csv"
          )

          df.to_csv(
              path,
              index=False
          )

          print(
              f"Saved BTC: {len(df):,} rows"
          )

          print(
              f"File: {path}"
          )
          PY


      # =====================================================
      # DOWNLOAD ETH
      # =====================================================

      - name: Download ETH 5m data
        run: |
          python - <<'PY'
          import ccxt
          import pandas as pd
          import time
          from pathlib import Path

          exchange = ccxt.binance()

          symbol = "ETH/USDT"

          timeframe = "5m"

          since = exchange.parse8601(
              "2021-01-01T00:00:00Z"
          )

          end = exchange.milliseconds()

          all_rows = []

          print("Downloading ETH/USDT 5m data...")

          while since < end:

              try:

                  rows = exchange.fetch_ohlcv(
                      symbol,
                      timeframe=timeframe,
                      since=since,
                      limit=1000
                  )

              except Exception as exc:

                  print(
                      f"Download error: {exc}"
                  )

                  time.sleep(5)

                  continue

              if not rows:
                  break

              all_rows.extend(rows)

              since = rows[-1][0] + 5 * 60 * 1000

              print(
                  f"ETH rows: {len(all_rows):,}"
              )

              time.sleep(
                  exchange.rateLimit / 1000
              )

          df = pd.DataFrame(
              all_rows,
              columns=[
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
                  "volume"
              ]
          )

          df["timestamp"] = pd.to_datetime(
              df["timestamp"],
              unit="ms",
              utc=True
          )

          df = df.drop_duplicates(
              subset=["timestamp"]
          )

          df = df.sort_values(
              "timestamp"
          )

          path = Path(
              "data/ETH_USDT_5m.csv"
          )

          df.to_csv(
              path,
              index=False
          )

          print(
              f"Saved ETH: {len(df):,} rows"
          )

          print(
              f"File: {path}"
          )
          PY


      # =====================================================
      # DOWNLOAD SOL
      # =====================================================

      - name: Download SOL 5m data
        run: |
          python - <<'PY'
          import ccxt
          import pandas as pd
          import time
          from pathlib import Path

          exchange = ccxt.binance()

          symbol = "SOL/USDT"

          timeframe = "5m"

          since = exchange.parse8601(
              "2021-01-01T00:00:00Z"
          )

          end = exchange.milliseconds()

          all_rows = []

          print("Downloading SOL/USDT 5m data...")

          while since < end:

              try:

                  rows = exchange.fetch_ohlcv(
                      symbol,
                      timeframe=timeframe,
                      since=since,
                      limit=1000
                  )

              except Exception as exc:

                  print(
                      f"Download error: {exc}"
                  )

                  time.sleep(5)

                  continue

              if not rows:
                  break

              all_rows.extend(rows)

              since = rows[-1][0] + 5 * 60 * 1000

              print(
                  f"SOL rows: {len(all_rows):,}"
              )

              time.sleep(
                  exchange.rateLimit / 1000
              )

          df = pd.DataFrame(
              all_rows,
              columns=[
                  "timestamp",
                  "open",
                  "high",
                  "low",
                  "close",
                  "volume"
              ]
          )

          df["timestamp"] = pd.to_datetime(
              df["timestamp"],
              unit="ms",
              utc=True
          )

          df = df.drop_duplicates(
              subset=["timestamp"]
          )

          df = df.sort_values(
              "timestamp"
          )

          path = Path(
              "data/SOL_USDT_5m.csv"
          )

          df.to_csv(
              path,
              index=False
          )

          print(
              f"Saved SOL: {len(df):,} rows"
          )

          print(
              f"File: {path}"
          )
          PY


      # =====================================================
      # FINAL DATA REPORT
      # =====================================================

      - name: Final data report
        run: |
          echo "=================================================="
          echo "FINAL DATA REPORT"
          echo "=================================================="

          for file in \
            data/BTC_USDT_5m.csv \
            data/ETH_USDT_5m.csv \
            data/SOL_USDT_5m.csv
          do

            echo
            echo "FILE: $file"

            if [ -f "$file" ]; then

              lines=$(wc -l < "$file")

              echo "Lines: $lines"

              if [ "$lines" -lt 500001 ]; then

                echo "ERROR: insufficient data"

                exit 1

              fi

            else

              echo "ERROR: file missing"

              exit 1

            fi

          done

          echo
          echo "ALL DATASETS VALID"


      # =====================================================
      # V6 BACKTEST
      # =====================================================

      - name: Run V6 Backtest
        run: |
          echo "=================================================="
          echo "RUNNING V6 BACKTEST"
          echo "=================================================="

          if [ -f v6_multi_asset_backtest.py ]; then

            python v6_multi_asset_backtest.py

          else

            echo "V6 runner not found - skipping"

          fi


      # =====================================================
      # V6-C STRESS
      # =====================================================

      - name: Run V6-C Stress Test
        run: |
          echo "=================================================="
          echo "RUNNING V6-C STRESS TEST"
          echo "=================================================="

          if [ -f v6_c_stress_test.py ]; then

            python v6_c_stress_test.py

          else

            echo "V6-C stress runner not found - skipping"

          fi


      # =====================================================
      # V6-C MONTE CARLO
      # =====================================================

      - name: Run V6-C Monte Carlo
        run: |
          echo "=================================================="
          echo "RUNNING V6-C MONTE CARLO"
          echo "=================================================="

          if [ -f v6_c_monte_carlo.py ]; then

            python v6_c_monte_carlo.py

          else

            echo "V6-C Monte Carlo runner not found - skipping"

          fi


      # =====================================================
      # V7-S0
      # =====================================================

      - name: Run V7-S0 Survival Backtest
        run: |
          echo "=================================================="
          echo "RUNNING V7 SURVIVAL BACKTEST"
          echo "=================================================="

          echo
          echo "Version:"
          echo "V7-S0"

          echo
          echo "Entry Engine:"
          echo "V6-C"

          echo
          echo "Survival Layer:"
          echo "Dynamic risk reduction"

          echo
          echo "Starting V7-S0..."
          echo

          python v7_survival_backtest.py

          echo
          echo "=================================================="
          echo "V7-S0 COMPLETE"
          echo "=================================================="


      # =====================================================
      # V7-S0 RESULTS
      # =====================================================

      - name: Show V7-S0 Results
        if: always()
        run: |
          echo "=================================================="
          echo "V7-S0 RESULT FILES"
          echo "=================================================="

          if [ -f v7_survival_results.csv ]; then

            echo
            echo "v7_survival_results.csv:"

            cat v7_survival_results.csv

          else

            echo
            echo "v7_survival_results.csv NOT FOUND"

          fi

          if [ -f v7_survival_summary.csv ]; then

            echo
            echo "v7_survival_summary.csv:"

            cat v7_survival_summary.csv

          else

            echo
            echo "v7_survival_summary.csv NOT FOUND"

          fi


      # =====================================================
      # V7-S1
      # =====================================================

      - name: Run V7-S1 Survival Backtest
        run: |
          echo "=================================================="
          echo "RUNNING V7-S1 SURVIVAL BACKTEST"
          echo "=================================================="

          echo
          echo "Version:"
          echo "V7-S1"

          echo
          echo "Entry Engine:"
          echo "V6-C + Breakout Quality Filter"

          echo
          echo "S1 Filter:"
          echo "Breakout >= 0.10 ATR"

          echo
          echo "Survival Layer:"
          echo "Dynamic risk reduction"

          echo
          echo "Starting V7-S1..."
          echo

          python v7_s1_backtest.py

          echo
          echo "=================================================="
          echo "V7-S1 COMPLETE"
          echo "=================================================="


      # =====================================================
      # V7-S1 RESULTS
      # =====================================================

      - name: Show V7-S1 Results
        if: always()
        run: |
          echo "=================================================="
          echo "V7-S1 RESULT FILES"
          echo "=================================================="

          if [ -f v7_s1_results.csv ]; then

            echo
            echo "v7_s1_results.csv:"

            cat v7_s1_results.csv

          else

            echo
            echo "v7_s1_results.csv NOT FOUND"

          fi

          if [ -f v7_s1_summary.csv ]; then

            echo
            echo "v7_s1_summary.csv:"

            cat v7_s1_summary.csv

          else

            echo
            echo "v7_s1_summary.csv NOT FOUND"

          fi


      # =====================================================
      # SHOW LOG DIRECTORY
      # =====================================================

      - name: Show log directory
        if: always()
        run: |
          echo "=================================================="
          echo "WORKSPACE FILES"
          echo "=================================================="

          echo
          echo "Repository:"
          find . -maxdepth 2 -type f | sort

          echo
          echo "CSV RESULTS:"
          find . -type f -name "*.csv" | sort


      # =====================================================
      # UPLOAD RESULTS
      # =====================================================

      - name: Upload V7 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-backtest-results
          path: |
            v7_survival_results.csv
            v7_survival_summary.csv
            v7_s1_results.csv
            v7_s1_summary.csv
          if-no-files-found: warn
name: 20to100 Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"

jobs:

  backtest:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            ccxt


      # ==========================================================
      # 4. DIRECTORIES
      # ==========================================================

      - name: Create directories
        run: |
          mkdir -p data
          mkdir -p logs


      # ==========================================================
      # 5. DOWNLOAD HISTORICAL DATA
      #
      # Binance api.binance.com is blocked on some
      # GitHub Actions runner locations with HTTP 451.
      #
      # Therefore use data.binance.com for market data.
      #
      # 3 years
      # BTC + ETH + SOL
      # 5 minute candles
      # ==========================================================

      - name: Download historical data
        run: |

          python <<'PY'

          import os
          import time
          import requests
          from concurrent.futures import ThreadPoolExecutor, as_completed


          # ======================================================
          # CONFIG
          # ======================================================

          BASE_URL = "https://data.binance.com/api/v3/klines"

          SYMBOLS = {
              "BTCUSDT": "data/BTC_USDT_5m.csv",
              "ETHUSDT": "data/ETH_USDT_5m.csv",
              "SOLUSDT": "data/SOL_USDT_5m.csv",
          }

          INTERVAL = "5m"

          # Binance max candles/request
          LIMIT = 1000

          # 3 years
          DAYS = 365 * 3

          END_MS = int(time.time() * 1000)
          START_MS = END_MS - DAYS * 24 * 60 * 60 * 1000


          # ======================================================
          # SESSION
          # ======================================================

          session = requests.Session()

          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })


          # ======================================================
          # DOWNLOAD FUNCTION
          # ======================================================

          def download_symbol(symbol, output_file):

              print()
              print("=" * 60)
              print(f"START {symbol}")
              print("=" * 60)

              all_rows = []

              current_start = START_MS

              request_count = 0

              while current_start < END_MS:

                  request_count += 1

                  params = {
                      "symbol": symbol,
                      "interval": INTERVAL,
                      "limit": LIMIT,
                      "startTime": current_start,
                      "endTime": END_MS,
                  }

                  success = False

                  for attempt in range(8):

                      try:

                          response = session.get(
                              BASE_URL,
                              params=params,
                              timeout=30
                          )

                          # --------------------------------------
                          # HTTP 451
                          # --------------------------------------

                          if response.status_code == 451:

                              raise RuntimeError(
                                  "HTTP 451 - Binance restricted "
                                  "this GitHub Actions runner."
                              )

                          response.raise_for_status()

                          rows = response.json()

                          if not rows:
                              success = True
                              break

                          all_rows.extend(rows)

                          last_open_time = rows[-1][0]

                          next_start = last_open_time + 1

                          if next_start <= current_start:
                              raise RuntimeError(
                                  "Pagination did not advance."
                              )

                          current_start = next_start

                          success = True

                          # Small delay to avoid aggressive requests
                          time.sleep(0.05)

                          break

                      except Exception as e:

                          print(
                              f"{symbol}: ERROR: {e} "
                              f"-> retry {attempt + 1}"
                          )

                          # Don't waste 8 retries on HTTP 451
                          if "451" in str(e):

                              print()
                              print(
                                  f"{symbol}: HTTP 451 detected."
                              )

                              print(
                                  "The GitHub Actions runner is "
                                  "blocked by Binance."
                              )

                              raise

                          wait = min(
                              2 ** attempt,
                              30
                          )

                          time.sleep(wait)


                  if not success:

                      raise RuntimeError(
                          f"{symbol}: request failed permanently."
                      )

                  if request_count % 100 == 0:

                      print(
                          f"{symbol}: "
                          f"{len(all_rows):,} candles downloaded"
                      )


              # ==================================================
              # WRITE CSV
              # ==================================================

              print()
              print(
                  f"{symbol}: "
                  f"TOTAL {len(all_rows):,} candles"
              )

              if not all_rows:

                  raise RuntimeError(
                      f"{symbol}: no data received."
                  )


              # Binance kline format:
              #
              # 0 open time
              # 1 open
              # 2 high
              # 3 low
              # 4 close
              # 5 volume
              # 6 close time
              # 7 quote volume
              # 8 number trades
              # 9 taker buy base volume
              # 10 taker buy quote volume
              # 11 ignore


              with open(output_file, "w") as f:

                  f.write(
                      "timestamp,open,high,low,close,volume\n"
                  )

                  for row in all_rows:

                      timestamp = row[0]

                      open_price = row[1]
                      high_price = row[2]
                      low_price = row[3]
                      close_price = row[4]
                      volume = row[5]

                      f.write(
                          f"{timestamp},"
                          f"{open_price},"
                          f"{high_price},"
                          f"{low_price},"
                          f"{close_price},"
                          f"{volume}\n"
                      )


              print(
                  f"{symbol}: SAVED -> {output_file}"
              )

              return symbol, len(all_rows)


          # ======================================================
          # PARALLEL DOWNLOAD
          # ======================================================

          print()
          print("=" * 60)
          print("DOWNLOADING HISTORICAL DATA")
          print("BTC + ETH + SOL")
          print("5m candles")
          print("3 years")
          print("PARALLEL DOWNLOAD")
          print("=" * 60)


          results = {}

          with ThreadPoolExecutor(
              max_workers=3
          ) as executor:

              futures = {
                  executor.submit(
                      download_symbol,
                      symbol,
                      output_file
                  ): symbol
                  for symbol, output_file
                  in SYMBOLS.items()
              }

              for future in as_completed(futures):

                  symbol = futures[future]

                  try:

                      name, count = future.result()

                      results[name] = count

                  except Exception as e:

                      print()
                      print(
                          f"FAILED {symbol}: {e}"
                      )

                      raise


          # ======================================================
          # FINAL DOWNLOAD REPORT
          # ======================================================

          print()
          print("=" * 60)
          print("DOWNLOAD COMPLETE")
          print("=" * 60)

          for symbol, count in results.items():

              print(
                  f"{symbol}: "
                  f"{count:,} candles"
              )

          print("=" * 60)

          PY


      # ==========================================================
      # 6. VERIFY DATA
      # ==========================================================

      - name: Verify historical data
        run: |

          echo "=================================================="
          echo "VERIFYING DATA"
          echo "=================================================="

          for file in \
            data/BTC_USDT_5m.csv \
            data/ETH_USDT_5m.csv \
            data/SOL_USDT_5m.csv
          do

            echo
            echo "FILE: $file"

            if [ ! -f "$file" ]; then
              echo "ERROR: file missing"
              exit 1
            fi

            rows=$(wc -l < "$file")

            echo "Rows: $rows"

            # 3 years of 5m data is roughly 315k candles.
            # Require at least 250k.

            if [ "$rows" -lt 250000 ]; then

              echo
              echo "ERROR: insufficient historical data"
              echo "Required: >= 250000 rows"
              echo "Found: $rows"

              exit 1

            fi

          done

          echo
          echo "DATA VERIFICATION PASSED"


      # ==========================================================
      # 7. SHOW DATA REPORT
      # ==========================================================

      - name: Final data report
        run: |

          echo "=================================================="
          echo "FINAL DATA REPORT"
          echo "=================================================="

          for file in \
            data/BTC_USDT_5m.csv \
            data/ETH_USDT_5m.csv \
            data/SOL_USDT_5m.csv
          do

            echo
            echo "----------------------------------------------"
            echo "$file"
            echo "----------------------------------------------"

            wc -l "$file"

            echo "First rows:"
            head -n 3 "$file"

            echo
            echo "Last rows:"
            tail -n 3 "$file"

          done


      # ==========================================================
      # 8. V6 BACKTEST
      # ==========================================================

      - name: Run V6 backtest
        if: always()
        run: |

          echo "=================================================="
          echo "RUNNING V6 BACKTEST"
          echo "=================================================="

          python v6_backtest.py


      # ==========================================================
      # 9. V6-C STRESS TEST
      # ==========================================================

      - name: Run V6-C stress test
        if: always()
        run: |

          echo "=================================================="
          echo "RUNNING V6-C STRESS TEST"
          echo "=================================================="

          python v6_c_stress.py


      # ==========================================================
      # 10. V6-C MONTE CARLO
      # ==========================================================

      - name: Run V6-C Monte Carlo
        if: always()
        run: |

          echo "=================================================="
          echo "RUNNING V6-C MONTE CARLO"
          echo "=================================================="

          python v6_c_monte_carlo.py


      # ==========================================================
      # 11. V7-S0 SURVIVAL
      # ==========================================================

      - name: Run V7-S0 survival backtest
        if: always()
        continue-on-error: true
        run: |

          echo "=================================================="
          echo "RUNNING V7-S0 SURVIVAL BACKTEST"
          echo "=================================================="

          python v7_survival_backtest.py


      # ==========================================================
      # 12. V7-S1 BREAKOUT FILTER
      # ==========================================================

      - name: Run V7-S1 backtest
        if: always()
        continue-on-error: true
        run: |

          echo "=================================================="
          echo "RUNNING V7-S1 BACKTEST"
          echo "=================================================="

          python v7_s1_backtest.py


      # ==========================================================
      # 13. LIST RESULTS
      # ==========================================================

      - name: Show results
        if: always()
        run: |

          echo "=================================================="
          echo "RESULT FILES"
          echo "=================================================="

          echo
          echo "CSV files:"
          find . -type f \
            \( -name "*.csv" -o -name "*.json" \) \
            -print | sort

          echo
          echo "Logs:"
          find logs -type f -print 2>/dev/null || true


      # ==========================================================
      # 14. UPLOAD ARTIFACTS
      # ==========================================================

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            data/*.csv
            *.csv
            *.json
            logs/**
          if-no-files-found: warn
          retention-days: 14

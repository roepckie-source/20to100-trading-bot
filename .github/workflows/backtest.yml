name: 20to100 Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # INSTALL DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            ccxt


      # ==================================================
      # CREATE DIRECTORIES
      # ==================================================

      - name: Prepare directories
        run: |
          mkdir -p data
          mkdir -p logs


      # ==================================================
      # CHECK DATA
      # ==================================================

      - name: Check cached market data
        run: |
          echo "=================================================="
          echo "CHECKING MARKET DATA"
          echo "=================================================="

          echo ""
          echo "DATA DIRECTORY:"
          ls -lah data || true

          echo ""
          echo "CSV FILES:"
          find data -maxdepth 1 -type f -name "*.csv" -print || true


      # ==================================================
      # ORIGINAL A/B/C
      # ==================================================

      - name: Run Original A B C Backtest
        run: |
          echo "=================================================="
          echo "RUNNING ORIGINAL A/B/C BACKTEST"
          echo "=================================================="

          python main.py


      # ==================================================
      # V2.1
      # ==================================================

      - name: Run V2.1 Backtest
        run: |
          echo "=================================================="
          echo "RUNNING V2.1"
          echo "DONCHIAN + EMA200 + ATR"
          echo "=================================================="

          python v2_backtest.py


      # ==================================================
      # V3
      # ==================================================

      - name: Run V3 Walk Forward
        run: |
          echo "=================================================="
          echo "RUNNING V3 WALK-FORWARD"
          echo "=================================================="

          python v3_backtest.py


      # ==================================================
      # V4
      # ==================================================

      - name: Run V4 Walk Forward
        run: |
          echo "=================================================="
          echo "RUNNING V4 WALK-FORWARD"
          echo "=================================================="

          python v4_backtest.py


      # ==================================================
      # V5
      #
      # V5 darf den Workflow nicht stoppen,
      # falls keine gültigen Walk-Forward-Fenster
      # vorhanden sind.
      # ==================================================

      - name: Run V5 Walk Forward
        continue-on-error: true
        run: |
          echo "=================================================="
          echo "RUNNING V5 WALK-FORWARD"
          echo "=================================================="

          python v5_backtest.py


      # ==================================================
      # V6 EXTENDED MULTI-ASSET
      #
      # BTC + ETH + SOL
      # 16 Walk-Forward-Fenster
      # V6_A + V6_B + V6_C
      # ==================================================

      - name: Run V6 Extended Multi Asset
        run: |
          echo "=================================================="
          echo "RUNNING V6 EXTENDED MULTI-ASSET"
          echo "BTC + ETH + SOL"
          echo "V6_A + V6_B + V6_C"
          echo "=================================================="

          python v6_extended_multi_asset_backtest.py


      # ==================================================
      # SHOW V6 EXTENDED RESULTS
      # ==================================================

      - name: Show V6 Extended Results
        if: always()
        run: |
          echo ""
          echo "=================================================="
          echo "V6 EXTENDED RESULTS"
          echo "=================================================="

          echo ""
          echo "DETAILED RESULTS:"

          if [ -f logs/v6_extended_multi_asset_results.csv ]; then
            cat logs/v6_extended_multi_asset_results.csv
          else
            echo "No detailed V6 result file found."
          fi


          echo ""
          echo "ASSET SUMMARY:"

          if [ -f logs/v6_extended_asset_summary.csv ]; then
            cat logs/v6_extended_asset_summary.csv
          else
            echo "No V6 asset summary found."
          fi


          echo ""
          echo "GLOBAL VARIANT SUMMARY:"

          if [ -f logs/v6_extended_multi_asset_summary.csv ]; then
            cat logs/v6_extended_multi_asset_summary.csv
          else
            echo "No V6 global summary found."
          fi


      # ==================================================
      # V6_C STRESS TEST
      #
      # Wird nur ausgeführt, wenn die Datei bereits
      # im Repository vorhanden ist.
      # ==================================================

      - name: Run V6 C Stress Test
        if: ${{ hashFiles('v6_c_stress_test.py') != '' }}
        run: |
          echo "=================================================="
          echo "RUNNING V6_C STRESS TEST"
          echo "=================================================="

          echo ""
          echo "ASSETS:"
          echo "  BTC/USDT"
          echo "  ETH/USDT"
          echo "  SOL/USDT"

          echo ""
          echo "FEES:"
          echo "  0.10%"
          echo "  0.15%"
          echo "  0.20%"

          echo ""
          echo "SLIPPAGE:"
          echo "  0.05%"
          echo "  0.10%"
          echo "  0.20%"

          echo ""
          echo "RISK PER TRADE:"
          echo "  0.50%"
          echo "  1.00%"
          echo "  1.50%"

          echo ""

          python v6_c_stress_test.py


      # ==================================================
      # SHOW STRESS TEST RESULTS
      # ==================================================

      - name: Show Stress Test Results
        if: always()
        run: |
          echo ""
          echo "=================================================="
          echo "V6_C STRESS TEST RESULTS"
          echo "=================================================="

          if [ -d logs ]; then

            echo ""
            echo "ALL LOG FILES:"
            find logs -maxdepth 1 -type f -print | sort

            echo ""
            echo "STRESS TEST CSV FILES:"

            find logs \
              -maxdepth 1 \
              -type f \
              -name "*stress*.csv" \
              -print \
              | sort


            for file in logs/*stress*.csv; do

              if [ -f "$file" ]; then

                echo ""
                echo "--------------------------------------------------"
                echo "$file"
                echo "--------------------------------------------------"

                cat "$file"

              fi

            done

          fi


      # ==================================================
      # UPLOAD BACKTEST RESULTS
      # ==================================================

      - name: Upload Backtest Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results

          path: |
            logs/

          if-no-files-found: warn

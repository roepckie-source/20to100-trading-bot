from pathlib import Path

workflow = """name: 20to100 Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests ccxt

      - name: Prepare directories
        run: |
          mkdir -p data
          mkdir -p logs

      - name: Show repository data
        run: |
          echo "=================================================="
          echo "EXISTING DATA"
          echo "=================================================="
          ls -lah data || true
          echo
          echo "Repository:"
          ls -lah

      # ==========================================================
      # FULL HISTORICAL DATA
      # ==========================================================

      - name: Download full historical data
        run: |
          echo "=================================================="
          echo "DOWNLOADING FULL HISTORICAL DATA"
          echo "BTC + ETH + SOL"
          echo "5m | approximately 5 years"
          echo "=================================================="

          python download_data.py

      - name: Verify historical data
        run: |
          echo "=================================================="
          echo "VERIFY HISTORICAL DATA"
          echo "=================================================="

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          files = [
              Path("data/BTC_USDT_5m.csv"),
              Path("data/ETH_USDT_5m.csv"),
              Path("data/SOL_USDT_5m.csv"),
          ]

          minimum = 500_000
          failed = False

          for path in files:
              print()
              print(f"Checking: {path}")

              if not path.exists():
                  print(f"ERROR: {path} does not exist")
                  failed = True
                  continue

              rows = len(pd.read_csv(path))
              print(f"Rows: {rows:,}")

              if rows < minimum:
                  print(
                      f"ERROR: only {rows:,} rows "
                      f"(minimum {minimum:,})"
                  )
                  failed = True
              else:
                  print("OK")

          if failed:
              raise SystemExit(
                  "Historical data verification failed."
              )
          PY

      # ==========================================================
      # ORIGINAL / BASELINE
      # ==========================================================

      - name: Run main baseline
        continue-on-error: true
        run: |
          echo "=================================================="
          echo "RUNNING BASELINE"
          echo "=================================================="

          python main.py

      # ==========================================================
      # V2
      # ==========================================================

      - name: Run V2 Backtest
        continue-on-error: true
        run: |
          echo "=================================================="
          echo "RUNNING V2.1"
          echo "DONCHIAN + EMA200 + ATR"
          echo "=================================================="

          python v2_backtest.py

      # ==========================================================
      # V3
      # ==========================================================

      - name: Run V3 Backtest
        continue-on-error: true
        run: |
          echo "=================================================="
          echo "RUNNING V3"
          echo "TREND FOLLOWING"
          echo "=================================================="

          python v3_backtest.py

      # ==========================================================
      # V4
      # ==========================================================

      - name: Run V4 Walk Forward
        continue-on-error: true
        run: |
          echo "=================================================="
          echo "RUNNING V4 WALK-FORWARD"
          echo "=================================================="

          python v4_backtest.py

      # ==========================================================
      # V5
      # ==========================================================

      - name: Run V5 Walk Forward
        continue-on-error: true
        run: |
          echo "=================================================="
          echo "RUNNING V5 WALK-FORWARD"
          echo "=================================================="

          python v5_backtest.py

      # ==========================================================
      # V6 EXTENDED
      # ==========================================================

      - name: Run V6 Extended Multi Asset
        run: |
          echo "=================================================="
          echo "RUNNING V6 EXTENDED MULTI-ASSET"
          echo "BTC + ETH + SOL"
          echo "V6_A + V6_B + V6_C"
          echo "=================================================="

          python v6_extended_multi_asset_backtest.py

      - name: Show V6 Extended Results
        if: always()
        run: |
          echo "=================================================="
          echo "V6 EXTENDED MULTI-ASSET RESULTS"
          echo "=================================================="

          if [ -f logs/v6_extended_multi_asset_results.csv ]; then
            echo
            echo "DETAILED RESULTS:"
            cat logs/v6_extended_multi_asset_results.csv
          fi

          if [ -f logs/v6_extended_asset_summary.csv ]; then
            echo
            echo "ASSET SUMMARY:"
            cat logs/v6_extended_asset_summary.csv
          fi

          if [ -f logs/v6_extended_multi_asset_summary.csv ]; then
            echo
            echo "GLOBAL VARIANT SUMMARY:"
            cat logs/v6_extended_multi_asset_summary.csv
          fi

      # ==========================================================
      # V6_C STRESS TEST
      # ==========================================================

      - name: Run V6_C Stress Test
        if: always()
        continue-on-error: true
        run: |
          echo "=================================================="
          echo "RUNNING V6_C STRESS TEST"
          echo "=================================================="

          if [ -f v6_c_stress_test.py ]; then
            python v6_c_stress_test.py
          else
            echo "v6_c_stress_test.py not found - skipped."
          fi

      - name: Show V6_C Stress Results
        if: always()
        run: |
          echo "=================================================="
          echo "V6_C STRESS TEST RESULTS"
          echo "=================================================="

          for file in \
            logs/v6_c_stress_test_results.csv \
            logs/v6_c_stress_test_summary.csv \
            logs/v6_c_stress_results.csv \
            logs/v6_c_stress_summary.csv
          do
            if [ -f "$file" ]; then
              echo
              echo "FILE: $file"
              cat "$file"
            fi
          done

      # ==========================================================
      # V6_C MONTE CARLO
      # ==========================================================

      - name: Run V6_C Monte Carlo
        if: always()
        continue-on-error: true
        run: |
          echo "=================================================="
          echo "RUNNING V6_C MONTE-CARLO VALIDATION"
          echo "10,000 simulations per OOS window"
          echo "=================================================="

          if [ -f v6_c_monte_carlo.py ]; then
            python v6_c_monte_carlo.py
          else
            echo "v6_c_monte_carlo.py not found - skipped."
          fi

      - name: Show V6_C Monte Carlo Results
        if: always()
        run: |
          echo "=================================================="
          echo "V6_C MONTE-CARLO RESULTS"
          echo "=================================================="

          for file in \
            logs/v6_c_monte_carlo_summary.csv \
            logs/v6_c_monte_carlo_window_results.csv
          do
            if [ -f "$file" ]; then
              echo
              echo "FILE: $file"
              cat "$file"
            fi
          done

      # ==========================================================
      # FINAL DATA REPORT
      # ==========================================================

      - name: Final data report
        if: always()
        run: |
          echo "=================================================="
          echo "FINAL DATA REPORT"
          echo "=================================================="

          for file in \
            data/BTC_USDT_5m.csv \
            data/ETH_USDT_5m.csv \
            data/SOL_USDT_5m.csv
          do
            if [ -f "$file" ]; then
              echo
              echo "$file"
              wc -l "$file"
              ls -lh "$file"
            else
              echo
              echo "MISSING: $file"
            fi
          done

      # ==========================================================
      # UPLOAD LOGS
      # ==========================================================

      - name: Upload backtest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 20to100-backtest-logs
          path: |
            logs/
          if-no-files-found: warn
"""

path = Path("/mnt/data/backtest.yml")
path.write_text(workflow, encoding="utf-8")
print(f"Erstellt: {path}")

name: Trading Bot Backtests

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy ccxt


      # ==================================================
      # SHOW FILES
      # ==================================================

      - name: Show repository structure
        run: |
          echo "=================================================="
          echo "REPOSITORY STRUCTURE"
          echo "=================================================="

          find . -maxdepth 3 -type f | sort


      # ==================================================
      # V1 / A-B-C BACKTEST
      # ==================================================

      - name: Run A B C Backtest
        run: |
          echo "=================================================="
          echo "RUNNING A/B/C BACKTEST"
          echo "=================================================="

          python main.py


      # ==================================================
      # V2 BACKTEST
      # ==================================================

      - name: Run V2 Backtest
        run: |
          echo "=================================================="
          echo "RUNNING V2 BACKTEST"
          echo "=================================================="

          python v2_backtest.py


      # ==================================================
      # V3 BACKTEST
      # ==================================================

      - name: Run V3 Backtest
        run: |
          echo "=================================================="
          echo "RUNNING V3 BACKTEST"
          echo "=================================================="

          python v3_backtest.py


      # ==================================================
      # V4 WALK FORWARD
      # ==================================================

      - name: Run V4 Walk Forward
        run: |
          echo "=================================================="
          echo "RUNNING V4 WALK-FORWARD"
          echo "=================================================="

          python v4_backtest.py


      # ==================================================
      # V5 WALK FORWARD
      # ==================================================

      - name: Run V5 Walk Forward
        run: |
          echo "=================================================="
          echo "RUNNING V5 WALK-FORWARD"
          echo "=================================================="

          python v5_backtest.py


      # ==================================================
      # V6 EXTENDED MULTI ASSET
      #
      # BTC + ETH + SOL
      # V6_A + V6_B + V6_C
      # 16 WALK-FORWARD WINDOWS
      # ==================================================

      - name: Run V6 Extended Multi Asset
        run: |
          echo "=================================================="
          echo "RUNNING V6 EXTENDED MULTI-ASSET BACKTEST"
          echo "=================================================="

          python v6_extended_multi_asset_backtest.py


      # ==================================================
      # V6_C STRESS TEST
      #
      # FIXED V6_C
      #
      # Fees:
      # 0.10%
      # 0.15%
      # 0.20%
      #
      # Slippage:
      # 0.05%
      # 0.10%
      # 0.20%
      #
      # Risk:
      # 0.50%
      # 1.00%
      # 1.50%
      #
      # BTC + ETH + SOL
      # 16 OOS WINDOWS
      #
      # 27 COMBINATIONS
      # 1296 BACKTESTS
      # ==================================================

      - name: Run V6 C Stress Test
        run: |
          echo "=================================================="
          echo "RUNNING V6_C STRESS TEST"
          echo "=================================================="

          python v6_c_stress_test.py


      # ==================================================
      # SHOW V6 EXTENDED RESULTS
      # ==================================================

      - name: Show V6 Extended Results
        run: |
          echo "=================================================="
          echo "V6 EXTENDED RESULTS"
          echo "=================================================="

          if [ -f logs/v6_extended_multi_asset_results.csv ]; then
            cat logs/v6_extended_multi_asset_results.csv
          else
            echo "No detailed V6 extended results found."
          fi

          echo ""
          echo "=================================================="
          echo "V6 EXTENDED ASSET SUMMARY"
          echo "=================================================="

          if [ -f logs/v6_extended_asset_summary.csv ]; then
            cat logs/v6_extended_asset_summary.csv
          else
            echo "No V6 extended asset summary found."
          fi

          echo ""
          echo "=================================================="
          echo "V6 EXTENDED GLOBAL SUMMARY"
          echo "=================================================="

          if [ -f logs/v6_extended_multi_asset_summary.csv ]; then
            cat logs/v6_extended_multi_asset_summary.csv
          else
            echo "No V6 extended global summary found."
          fi


      # ==================================================
      # SHOW V6_C STRESS TEST RESULTS
      # ==================================================

      - name: Show V6 C Stress Test Results
        run: |
          echo "=================================================="
          echo "V6_C STRESS TEST RESULTS"
          echo "=================================================="

          if [ -f logs/v6_c_stress_test_results.csv ]; then
            cat logs/v6_c_stress_test_results.csv
          else
            echo "No V6_C stress test detailed results found."
          fi

          echo ""
          echo "=================================================="
          echo "V6_C STRESS TEST ASSET SUMMARY"
          echo "=================================================="

          if [ -f logs/v6_c_stress_test_asset_summary.csv ]; then
            cat logs/v6_c_stress_test_asset_summary.csv
          else
            echo "No V6_C stress test asset summary found."
          fi

          echo ""
          echo "=================================================="
          echo "V6_C STRESS TEST GLOBAL SUMMARY"
          echo "=================================================="

          if [ -f logs/v6_c_stress_test_summary.csv ]; then
            cat logs/v6_c_stress_test_summary.csv
          else
            echo "No V6_C stress test global summary found."
          fi

          echo ""
          echo "=================================================="
          echo "V6_C STRESS TEST RANKING"
          echo "=================================================="

          if [ -f logs/v6_c_stress_test_ranking.csv ]; then
            cat logs/v6_c_stress_test_ranking.csv
          else
            echo "No V6_C stress test ranking found."
          fi


      # ==================================================
      # UPLOAD BACKTEST RESULTS
      # ==================================================

      - name: Upload Backtest Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-bot-backtest-results
          path: |
            logs/*.csv
          if-no-files-found: warn

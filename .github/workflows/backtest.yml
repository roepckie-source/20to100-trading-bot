name: 20to100 Backtest

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 5 * * *"


jobs:

  backtest:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            ccxt


      # ==========================================================
      # 4. DIRECTORIES
      # ==========================================================

      - name: Create directories
        run: |

          mkdir -p data
          mkdir -p logs


      # ==========================================================
      # 5. DOWNLOAD HISTORICAL DATA
      #
      # Binance Public Data
      #
      # Completed months:
      #   monthly ZIP files
      #
      # Current month:
      #   daily ZIP files
      #
      # Assets:
      #   BTCUSDT
      #   ETHUSDT
      #   SOLUSDT
      #
      # Interval:
      #   5m
      #
      # History:
      #   3 years
      #
      # ==========================================================

      - name: Download historical data
        run: |

          python <<'PY'

          import io
          import zipfile
          import requests
          import pandas as pd

          from datetime import date, timedelta


          # ======================================================
          # CONFIG
          # ======================================================

          BASE_URL = (
              "https://data.binance.vision/data/spot"
          )

          INTERVAL = "5m"

          SYMBOLS = {

              "BTCUSDT":
                  "data/BTC_USDT_5m.csv",

              "ETHUSDT":
                  "data/ETH_USDT_5m.csv",

              "SOLUSDT":
                  "data/SOL_USDT_5m.csv",

          }

          YEARS_BACK = 3


          # ======================================================
          # DATE RANGE
          # ======================================================

          today = date.today()

          start_date = date(
              today.year - YEARS_BACK,
              today.month,
              today.day
          )

          end_date = today - timedelta(days=1)


          print()
          print("=" * 70)
          print("BINANCE PUBLIC DATA DOWNLOAD")
          print("=" * 70)
          print()
          print(f"Start date : {start_date}")
          print(f"End date   : {end_date}")
          print(f"Interval   : {INTERVAL}")
          print("Assets     : BTC + ETH + SOL")
          print("History    : 3 years")
          print("=" * 70)


          # ======================================================
          # HTTP SESSION
          # ======================================================

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "20to100-trading-bot/1.0"
          })


          # ======================================================
          # BINANCE COLUMN NAMES
          # ======================================================

          COLUMNS = [

              "open_time",
              "open",
              "high",
              "low",
              "close",
              "volume",
              "close_time",
              "quote_volume",
              "trades",
              "taker_buy_base",
              "taker_buy_quote",
              "ignore",

          ]


          # ======================================================
          # MONTH ITERATOR
          # ======================================================

          def month_iterator(start, end):

              current = date(
                  start.year,
                  start.month,
                  1
              )

              end_month = date(
                  end.year,
                  end.month,
                  1
              )

              while current <= end_month:

                  yield current

                  if current.month == 12:

                      current = date(
                          current.year + 1,
                          1,
                          1
                      )

                  else:

                      current = date(
                          current.year,
                          current.month + 1,
                          1
                      )


          # ======================================================
          # DOWNLOAD ZIP
          # ======================================================

          def download_zip(url):

              print()
              print(f"DOWNLOAD: {url}")

              response = session.get(
                  url,
                  timeout=60
              )

              if response.status_code == 404:

                  return None

              response.raise_for_status()

              return response.content


          # ======================================================
          # READ ZIP
          # ======================================================

          def read_zip(content):

              if content is None:
                  return None

              with zipfile.ZipFile(
                  io.BytesIO(content)
              ) as z:

                  csv_files = [

                      name

                      for name in z.namelist()

                      if name.lower().endswith(".csv")

                  ]

                  if not csv_files:

                      raise RuntimeError(
                          "ZIP enthält keine CSV-Datei."
                      )

                  csv_name = csv_files[0]

                  with z.open(csv_name) as f:

                      df = pd.read_csv(
                          f,
                          header=None
                      )

              if df.empty:
                  return None

              # Binance files normally contain 12 columns.
              # Be defensive in case of unexpected extra columns.

              if len(df.columns) != len(COLUMNS):

                  raise RuntimeError(
                      "Unerwartete Anzahl Spalten: "
                      f"{len(df.columns)}"
                  )

              df.columns = COLUMNS

              return df


          # ======================================================
          # DOWNLOAD SYMBOL
          # ======================================================

          def download_symbol(
              symbol,
              output_file
          ):

              print()
              print("=" * 70)
              print(f"PROCESSING {symbol}")
              print("=" * 70)


              frames = []


              monthly_count = 0
              daily_count = 0


              # ==================================================
              # COMPLETED MONTHS
              #
              # Example:
              #
              # Today = 2026-09-07
              #
              # August 2026 is completed.
              #
              # Therefore:
              #
              # 2026-08 -> MONTHLY
              # 2026-09 -> DAILY
              #
              # ==================================================

              current_month = date(
                  today.year,
                  today.month,
                  1
              )


              previous_day = (
                  current_month
                  - timedelta(days=1)
              )


              last_completed_month = date(
                  previous_day.year,
                  previous_day.month,
                  1
              )


              # ==================================================
              # MONTHLY FILES
              # ==================================================

              for month in month_iterator(
                  start_date,
                  last_completed_month
              ):

                  filename = (

                      f"{symbol}-"
                      f"{INTERVAL}-"
                      f"{month.year}-"
                      f"{month.month:02d}.zip"

                  )


                  url = (

                      f"{BASE_URL}/monthly/klines/"
                      f"{symbol}/{INTERVAL}/"
                      f"{filename}"

                  )


                  content = download_zip(url)


                  if content is None:

                      raise RuntimeError(

                          "Monatsdatei fehlt:\n"
                          f"{url}"

                      )


                  df = read_zip(content)


                  if df is None:

                      raise RuntimeError(

                          f"Leere Monatsdatei:\n{url}"

                      )


                  frames.append(df)

                  monthly_count += 1


                  print(

                      f"{symbol}: "
                      f"MONTH "
                      f"{month.year}-"
                      f"{month.month:02d} "
                      f"-> "
                      f"{len(df):,} rows"

                  )


              # ==================================================
              # CURRENT MONTH = DAILY FILES
              #
              # This fixes the August/September problem.
              # ==================================================

              current_day = date(
                  today.year,
                  today.month,
                  1
              )


              while current_day <= end_date:

                  # Don't download days before our start date.

                  if current_day < start_date:

                      current_day += timedelta(days=1)

                      continue


                  filename = (

                      f"{symbol}-"
                      f"{INTERVAL}-"
                      f"{current_day.year}-"
                      f"{current_day.month:02d}-"
                      f"{current_day.day:02d}.zip"

                  )


                  url = (

                      f"{BASE_URL}/daily/klines/"
                      f"{symbol}/{INTERVAL}/"
                      f"{filename}"

                  )


                  content = download_zip(url)


                  if content is None:

                      raise RuntimeError(

                          "Tagesdatei fehlt:\n"
                          f"{url}"

                      )


                  df = read_zip(content)


                  if df is not None:

                      frames.append(df)

                      daily_count += 1


                      print(

                          f"{symbol}: "
                          f"DAY "
                          f"{current_day} "
                          f"-> "
                          f"{len(df):,} rows"

                      )


                  current_day += timedelta(days=1)


              # ==================================================
              # CHECK
              # ==================================================

              if not frames:

                  raise RuntimeError(

                      f"{symbol}: "
                      "keine Daten gefunden."

                  )


              # ==================================================
              # COMBINE
              # ==================================================

              df = pd.concat(
                  frames,
                  ignore_index=True
              )


              print()
              print(
                  f"{symbol}: "
                  f"RAW COMBINED ROWS = "
                  f"{len(df):,}"
              )


              # ==================================================
              # TIMESTAMP
              #
              # Binance historical datasets can contain
              # millisecond or microsecond timestamps.
              #
              # Normalize to milliseconds.
              # ==================================================

              df["open_time"] = pd.to_numeric(
                  df["open_time"],
                  errors="coerce"
              )


              df = df.dropna(
                  subset=["open_time"]
              )


              microseconds = (
                  df["open_time"] > 10**14
              )


              df.loc[
                  microseconds,
                  "open_time"
              ] = (

                  df.loc[
                      microseconds,
                      "open_time"
                  ] / 1000

              )


              df["open_time"] = (

                  df["open_time"]
                  .astype("int64")

              )


              # ==================================================
              # NUMERIC COLUMNS
              # ==================================================

              numeric_columns = [

                  "open",
                  "high",
                  "low",
                  "close",
                  "volume",

              ]


              for column in numeric_columns:

                  df[column] = pd.to_numeric(

                      df[column],
                      errors="coerce"

                  )


              # ==================================================
              # REMOVE INVALID PRICE DATA
              # ==================================================

              df = df.dropna(

                  subset=[
                      "open",
                      "high",
                      "low",
                      "close",
                      "volume",
                  ]

              )


              # ==================================================
              # EXACT DATE RANGE
              # ==================================================

              start_timestamp = int(

                  pd.Timestamp(
                      start_date,
                      tz="UTC"
                  ).timestamp()

                  * 1000

              )


              end_timestamp = int(

                  pd.Timestamp(
                      today,
                      tz="UTC"
                  ).timestamp()

                  * 1000

              )


              df = df[

                  (df["open_time"] >= start_timestamp)
                  &
                  (df["open_time"] < end_timestamp)

              ]


              # ==================================================
              # REMOVE DUPLICATES
              # ==================================================

              before = len(df)


              df = df.drop_duplicates(

                  subset=["open_time"]

              )


              duplicates_removed = (
                  before - len(df)
              )


              # ==================================================
              # SORT
              # ==================================================

              df = df.sort_values(
                  "open_time"
              )


              # ==================================================
              # FINAL FORMAT
              # ==================================================

              output = df[

                  [
                      "open_time",
                      "open",
                      "high",
                      "low",
                      "close",
                      "volume",
                  ]

              ].copy()


              output = output.rename(

                  columns={
                      "open_time": "timestamp"
                  }

              )


              # ==================================================
              # WRITE CSV
              # ==================================================

              output.to_csv(

                  output_file,
                  index=False

              )


              # ==================================================
              # FINAL REPORT
              # ==================================================

              print()
              print(
                  "=" * 70
              )

              print(
                  f"{symbol}: "
                  "DOWNLOAD COMPLETE"
              )

              print(
                  f"{symbol}: "
                  f"Monthly files = "
                  f"{monthly_count}"
              )

              print(
                  f"{symbol}: "
                  f"Daily files = "
                  f"{daily_count}"
              )

              print(
                  f"{symbol}: "
                  f"Duplicates removed = "
                  f"{duplicates_removed:,}"
              )

              print(
                  f"{symbol}: "
                  f"FINAL ROWS = "
                  f"{len(output):,}"
              )

              print(
                  f"{symbol}: "
                  f"OUTPUT = "
                  f"{output_file}"
              )


              if len(output) > 0:

                  first_ts = pd.to_datetime(

                      output["timestamp"].min(),
                      unit="ms",
                      utc=True

                  )


                  last_ts = pd.to_datetime(

                      output["timestamp"].max(),
                      unit="ms",
                      utc=True

                  )


                  print(
                      f"{symbol}: "
                      f"START = "
                      f"{first_ts}"
                  )

                  print(
                      f"{symbol}: "
                      f"END = "
                      f"{last_ts}"
                  )


              print(
                  "=" * 70
              )


              return len(output)


          # ======================================================
          # DOWNLOAD ALL SYMBOLS
          # ======================================================

          results = {}


          for symbol, output_file in SYMBOLS.items():

              results[symbol] = download_symbol(

                  symbol,
                  output_file

              )


          # ======================================================
          # FINAL DOWNLOAD REPORT
          # ======================================================

          print()
          print("=" * 70)
          print("ALL DATA DOWNLOADS COMPLETE")
          print("=" * 70)


          for symbol, rows in results.items():

              print(

                  f"{symbol}: "
                  f"{rows:,} candles"

              )


          print("=" * 70)


          PY


      # ==========================================================
      # 6. VERIFY DATA
      #
      # IMPORTANT:
      #
      # If this fails, no backtest starts.
      #
      # ==========================================================

      - name: Verify historical data
        run: |

          echo "=================================================="
          echo "VERIFYING HISTORICAL DATA"
          echo "=================================================="


          for file in \
            data/BTC_USDT_5m.csv \
            data/ETH_USDT_5m.csv \
            data/SOL_USDT_5m.csv
          do

            echo
            echo "----------------------------------------------"
            echo "FILE: $file"
            echo "----------------------------------------------"


            # ----------------------------------------------------
            # FILE EXISTS
            # ----------------------------------------------------

            if [ ! -f "$file" ]; then

              echo
              echo "ERROR: FILE DOES NOT EXIST"
              echo "$file"

              exit 1

            fi


            # ----------------------------------------------------
            # ROW COUNT
            # ----------------------------------------------------

            rows=$(($(wc -l < "$file") - 1))


            echo "Rows: $rows"


            # ----------------------------------------------------
            # MINIMUM DATA
            # ----------------------------------------------------

            if [ "$rows" -lt 250000 ]; then

              echo
              echo "ERROR: INSUFFICIENT DATA"
              echo "Required: >= 250000 candles"
              echo "Found: $rows"

              exit 1

            fi


            # ----------------------------------------------------
            # HEADER
            # ----------------------------------------------------

            echo
            echo "Header:"

            head -n 1 "$file"


            # ----------------------------------------------------
            # FIRST ROW
            # ----------------------------------------------------

            echo
            echo "First data row:"

            sed -n '2p' "$file"


            # ----------------------------------------------------
            # LAST ROW
            # ----------------------------------------------------

            echo
            echo "Last data row:"

            tail -n 1 "$file"


            echo
            echo "OK: $file"

          done


          echo
          echo "=================================================="
          echo "ALL DATA FILES VERIFIED"
          echo "=================================================="


      # ==========================================================
      # 7. FINAL DATA REPORT
      # ==========================================================

      - name: Final data report
        run: |

          echo "=================================================="
          echo "FINAL DATA REPORT"
          echo "=================================================="


          python <<'PY'

          import pandas as pd

          from pathlib import Path


          files = [

              Path(
                  "data/BTC_USDT_5m.csv"
              ),

              Path(
                  "data/ETH_USDT_5m.csv"
              ),

              Path(
                  "data/SOL_USDT_5m.csv"
              ),

          ]


          for path in files:

              print()
              print("=" * 60)
              print(path)
              print("=" * 60)


              df = pd.read_csv(path)


              print(
                  "Rows:",
                  f"{len(df):,}"
              )


              print(
                  "Columns:",
                  list(df.columns)
              )


              if len(df) > 0:

                  print(
                      "Start:",
                      pd.to_datetime(
                          df["timestamp"].min(),
                          unit="ms",
                          utc=True
                      )
                  )


                  print(
                      "End:",
                      pd.to_datetime(
                          df["timestamp"].max(),
                          unit="ms",
                          utc=True
                      )
                  )


              print(
                  "Duplicate timestamps:",
                  df["timestamp"].duplicated().sum()
              )


              print(
                  "Missing open:",
                  df["open"].isna().sum()
              )


              print(
                  "Missing high:",
                  df["high"].isna().sum()
              )


              print(
                  "Missing low:",
                  df["low"].isna().sum()
              )


              print(
                  "Missing close:",
                  df["close"].isna().sum()
              )


              print(
                  "Missing volume:",
                  df["volume"].isna().sum()
              )


          print()
          print("=" * 60)
          print("DATA REPORT COMPLETE")
          print("=" * 60)

          PY


      # ==========================================================
      # 8. V6 BACKTEST
      # ==========================================================

      - name: Run V6 backtest
        run: |

          echo "=================================================="
          echo "RUNNING V6 BACKTEST"
          echo "=================================================="

          python v6_backtest.py


      # ==========================================================
      # 9. V6-C STRESS TEST
      # ==========================================================

      - name: Run V6-C stress test
        run: |

          echo "=================================================="
          echo "RUNNING V6-C STRESS TEST"
          echo "=================================================="

          python v6_c_stress.py


      # ==========================================================
      # 10. V6-C MONTE CARLO
      # ==========================================================

      - name: Run V6-C Monte Carlo
        run: |

          echo "=================================================="
          echo "RUNNING V6-C MONTE CARLO"
          echo "=================================================="

          python v6_c_monte_carlo.py


      # ==========================================================
      # 11. V7-S0 SURVIVAL BACKTEST
      # ==========================================================

      - name: Run V7-S0 survival backtest
        run: |

          echo "=================================================="
          echo "RUNNING V7-S0 SURVIVAL BACKTEST"
          echo "=================================================="

          python v7_survival_backtest.py


      # ==========================================================
      # 12. V7-S1 BACKTEST
      # ==========================================================

      - name: Run V7-S1 backtest
        run: |

          echo "=================================================="
          echo "RUNNING V7-S1 BACKTEST"
          echo "=================================================="

          python v7_s1_backtest.py


      # ==========================================================
      # 13. SHOW RESULTS
      #
      # This is allowed to run even if a backtest fails.
      # ==========================================================

      - name: Show results
        if: always()
        run: |

          echo "=================================================="
          echo "RESULT FILES"
          echo "=================================================="


          echo
          echo "CSV / JSON files:"


          find . \
            -type f \
            \( \
              -name "*.csv" \
              -o \
              -name "*.json" \
            \) \
            -print \
            | sort


          echo
          echo "Logs:"


          find logs \
            -type f \
            -print \
            2>/dev/null || true


      # ==========================================================
      # 14. UPLOAD RESULTS
      # ==========================================================

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: backtest-results

          path: |

            data/*.csv

            *.csv

            *.json

            logs/**

          if-no-files-found: warn

          retention-days: 14

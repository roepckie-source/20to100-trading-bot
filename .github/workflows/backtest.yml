name: 20to100 Backtest

on:
  workflow_dispatch:

jobs:

  backtest:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # DOWNLOAD HISTORICAL DATA
      # ======================================================

      - name: Download historical BTC and ETH data
        run: |
          echo "=================================================="
          echo "DOWNLOADING HISTORICAL MARKET DATA"
          echo "=================================================="

          python data/data_manager.py


      # ======================================================
      # SHOW DATA FILES
      # ======================================================

      - name: Show downloaded data
        run: |
          echo "=================================================="
          echo "DOWNLOADED DATA"
          echo "=================================================="

          ls -lh data/

          echo ""
          echo "BTC:"

          python - <<'PY'
          import pandas as pd

          file = "data/BTC_USDT_5m.csv"

          df = pd.read_csv(
              file,
              index_col="timestamp",
              parse_dates=True
          )

          print(f"Rows: {len(df):,}")
          print(f"From: {df.index.min()}")
          print(f"To:   {df.index.max()}")
          PY

          echo ""
          echo "ETH:"

          python - <<'PY'
          import pandas as pd

          file = "data/ETH_USDT_5m.csv"

          df = pd.read_csv(
              file,
              index_col="timestamp",
              parse_dates=True
          )

          print(f"Rows: {len(df):,}")
          print(f"From: {df.index.min()}")
          print(f"To:   {df.index.max()}")
          PY


      # ======================================================
      # ORIGINAL A/B/C BACKTEST
      # ======================================================

      - name: Run original A-B-C backtest
        run: |
          echo "=================================================="
          echo "RUNNING ORIGINAL A/B/C BACKTEST"
          echo "=================================================="

          python main.py


      # ======================================================
      # V2.1 BACKTEST
      # ======================================================

      - name: Run V2.1 Donchian EMA200 ATR backtest
        run: |
          echo "=================================================="
          echo "RUNNING V2.1"
          echo "DONCHIAN + EMA200 + ATR"
          echo "=================================================="

          python v2_backtest.py


      # ======================================================
      # V3 ROBUSTNESS BACKTEST
      # ======================================================

      - name: Run V3 robustness backtest
        run: |
          echo "=================================================="
          echo "RUNNING V3 ROBUSTNESS BACKTEST"
          echo "=================================================="

          python v3_backtest.py


      # ======================================================
      # V4 WALK-FORWARD BACKTEST
      # ======================================================

      - name: Run V4 walk-forward backtest
        run: |
          echo "=================================================="
          echo "RUNNING V4 WALK-FORWARD BACKTEST"
          echo "=================================================="

          python v4_backtest.py

            - name: Run V5 walk-forward backtest
        run: |
          echo "=================================================="
          echo "RUNNING V5 REGIME-FILTER WALK-FORWARD BACKTEST"
          echo "=================================================="

          python v5_backtest.py

      # ======================================================
      # UPLOAD RESULTS
      # ======================================================

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            logs/
            data/*.csv
          if-no-files-found: ignore

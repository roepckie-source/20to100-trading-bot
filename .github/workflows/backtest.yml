name: 20to100 Backtest

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 5 * * *"


jobs:

  backtest:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            ccxt


      # ==========================================================
      # DIRECTORIES
      # ==========================================================

      - name: Prepare directories

        run: |

          mkdir -p data
          mkdir -p logs


      # ==========================================================
      # SHOW REPOSITORY
      # ==========================================================

      - name: Show repository files

        run: |

          echo
          echo "=================================================="
          echo "REPOSITORY"
          echo "=================================================="

          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            | sort


      # ==========================================================
      # DOWNLOAD DATA
      # ==========================================================

      - name: Download BTC ETH SOL 5m data

        run: |

          echo
          echo "=================================================="
          echo "DOWNLOADING HISTORICAL DATA"
          echo "=================================================="

          echo
          echo "Assets:"
          echo "BTC"
          echo "ETH"
          echo "SOL"

          echo
          echo "Timeframe:"
          echo "5 minutes"

          echo
          echo "Approximately 5 years"

          echo
          echo "=================================================="

          python download_data.py


      # ==========================================================
      # VERIFY DATA
      # ==========================================================

      - name: Verify downloaded data

        run: |

          echo
          echo "=================================================="
          echo "VERIFY DOWNLOADED DATA"
          echo "=================================================="

          python - <<'PY'

          from pathlib import Path
          import pandas as pd

          files = [

              Path("data/BTC_USDT_5m.csv"),

              Path("data/ETH_USDT_5m.csv"),

              Path("data/SOL_USDT_5m.csv"),

          ]

          minimum_rows = 500_000

          failed = False

          for path in files:

              print()
              print("----------------------------------------")
              print(path)
              print("----------------------------------------")

              if not path.exists():

                  print("ERROR: FILE NOT FOUND")

                  failed = True

                  continue

              try:

                  df = pd.read_csv(path)

              except Exception as exc:

                  print(
                      f"ERROR READING FILE: {exc}"
                  )

                  failed = True

                  continue

              rows = len(df)

              print(
                  f"Rows: {rows:,}"
              )

              print(
                  f"Size: {path.stat().st_size / 1024 / 1024:.2f} MB"
              )

              if rows < minimum_rows:

                  print(
                      f"ERROR: only {rows:,} rows"
                  )

                  print(
                      f"Minimum required: {minimum_rows:,}"
                  )

                  failed = True

              else:

                  print("OK")

          if failed:

              raise SystemExit(
                  "Historical data verification failed."
              )

          print()
          print("==================================================")
          print("ALL DATA FILES VERIFIED")
          print("==================================================")

          PY


      # ==========================================================
      # V6 BASELINE
      # ==========================================================

      - name: Run V6 backtest

        run: |

          echo
          echo "=================================================="
          echo "RUNNING V6 BACKTEST"
          echo "=================================================="

          echo
          echo "Assets:"
          echo "BTC + ETH + SOL"

          echo
          echo "Variant:"
          echo "V6-C"

          echo
          echo "=================================================="

          python v6_multi_asset_backtest.py


      # ==========================================================
      # V6-C STRESS TEST
      # ==========================================================

      - name: Run V6-C stress test

        run: |

          echo
          echo "=================================================="
          echo "RUNNING V6-C STRESS TEST"
          echo "=================================================="

          if [ -f v6_c_stress_test.py ]; then

            python v6_c_stress_test.py

          else

            echo
            echo "WARNING:"
            echo "v6_c_stress_test.py not found."

          fi


      # ==========================================================
      # V6-C MONTE CARLO
      # ==========================================================

      - name: Run V6-C Monte Carlo

        run: |

          echo
          echo "=================================================="
          echo "RUNNING V6-C MONTE CARLO"
          echo "=================================================="

          echo
          echo "Simulations:"
          echo "10,000"

          echo
          echo "=================================================="

          if [ -f v6_c_monte_carlo.py ]; then

            python v6_c_monte_carlo.py

          else

            echo
            echo "WARNING:"
            echo "v6_c_monte_carlo.py not found."

          fi


      # ==========================================================
      # V7-S0 SURVIVAL BACKTEST
      # ==========================================================

      - name: Run V7-S0 survival backtest

        run: |

          echo
          echo "=================================================="
          echo "RUNNING V7-S0 SURVIVAL BACKTEST"
          echo "=================================================="

          echo
          echo "Version:"
          echo "V7-S0"

          echo
          echo "Entry:"
          echo "V6-C"

          echo
          echo "Survival Layer:"
          echo "Dynamic risk reduction"
          echo "Daily loss protection"
          echo "Consecutive-loss protection"
          echo "Cooldown"
          echo "Global drawdown protection"

          echo
          echo "Assets:"
          echo "BTC + ETH + SOL"

          echo
          echo "Capital:"
          echo "20 USDT"
          echo "50 USDT"
          echo "100 USDT"
          echo "250 USDT"

          echo
          echo "Walk Forward:"
          echo "12 months TRAIN"
          echo "3 months OOS"
          echo "3 months rolling step"

          echo
          echo "=================================================="

          python v7_survival_backtest.py


      # ==========================================================
      # V7-S1 BACKTEST
      # ==========================================================

      - name: Run V7-S1 backtest

        run: |

          echo
          echo "=================================================="
          echo "RUNNING V7-S1 BACKTEST"
          echo "=================================================="

          echo
          echo "Version:"
          echo "V7-S1"

          echo
          echo "Base:"
          echo "V7-S0"

          echo
          echo "Entry:"
          echo "V6-C"

          echo
          echo "Additional filter:"
          echo "Donchian breakout >= 0.10 ATR"

          echo
          echo "Assets:"
          echo "BTC + ETH + SOL"

          echo
          echo "Capital:"
          echo "20 USDT"
          echo "50 USDT"
          echo "100 USDT"
          echo "250 USDT"

          echo
          echo "Walk Forward:"
          echo "12 months TRAIN"
          echo "3 months OOS"
          echo "3 months rolling step"

          echo
          echo "=================================================="

          python v7_s1_backtest.py


      # ==========================================================
      # VERIFY V7 RESULTS
      # ==========================================================

      - name: Verify V7 result files

        run: |

          echo
          echo "=================================================="
          echo "VERIFY V7 RESULT FILES"
          echo "=================================================="

          failed=0


          echo
          echo "V7-S0"

          if [ -f v7_survival_results.csv ]; then

            echo "OK: v7_survival_results.csv"

          else

            echo "ERROR: v7_survival_results.csv NOT FOUND"

            failed=1

          fi


          if [ -f v7_survival_summary.csv ]; then

            echo "OK: v7_survival_summary.csv"

          else

            echo "ERROR: v7_survival_summary.csv NOT FOUND"

            failed=1

          fi


          echo
          echo "V7-S1"

          if [ -f v7_s1_results.csv ]; then

            echo "OK: v7_s1_results.csv"

          else

            echo "ERROR: v7_s1_results.csv NOT FOUND"

            failed=1

          fi


          if [ -f v7_s1_summary.csv ]; then

            echo "OK: v7_s1_summary.csv"

          else

            echo "ERROR: v7_s1_summary.csv NOT FOUND"

            failed=1

          fi


          echo

          if [ "$failed" -ne 0 ]; then

            echo "V7 RESULT VERIFICATION FAILED."

            exit 1

          fi


          echo "=================================================="
          echo "ALL V7 RESULT FILES PRESENT"
          echo "=================================================="


      # ==========================================================
      # SHOW V7-S0 RESULTS
      # ==========================================================

      - name: Show V7-S0 results

        if: always()

        run: |

          echo
          echo "=================================================="
          echo "V7-S0 RESULTS"
          echo "=================================================="


          echo
          echo "=================================================="
          echo "V7-S0 SUMMARY"
          echo "=================================================="

          if [ -f v7_survival_summary.csv ]; then

            cat v7_survival_summary.csv

          else

            echo "v7_survival_summary.csv NOT FOUND"

          fi


          echo
          echo "=================================================="
          echo "V7-S0 DETAILS"
          echo "=================================================="

          if [ -f v7_survival_results.csv ]; then

            echo "Showing first 100 rows:"

            head -100 v7_survival_results.csv

          else

            echo "v7_survival_results.csv NOT FOUND"

          fi


      # ==========================================================
      # SHOW V7-S1 RESULTS
      # ==========================================================

      - name: Show V7-S1 results

        if: always()

        run: |

          echo
          echo "=================================================="
          echo "V7-S1 RESULTS"
          echo "=================================================="


          echo
          echo "=================================================="
          echo "V7-S1 SUMMARY"
          echo "=================================================="

          if [ -f v7_s1_summary.csv ]; then

            cat v7_s1_summary.csv

          else

            echo "v7_s1_summary.csv NOT FOUND"

          fi


          echo
          echo "=================================================="
          echo "V7-S1 DETAILS"
          echo "=================================================="

          if [ -f v7_s1_results.csv ]; then

            echo "Showing first 100 rows:"

            head -100 v7_s1_results.csv

          else

            echo "v7_s1_results.csv NOT FOUND"

          fi


      # ==========================================================
      # COMPARE V7-S0 / V7-S1
      # ==========================================================

      - name: Compare V7-S0 vs V7-S1

        if: always()

        run: |

          echo
          echo "=================================================="
          echo "V7-S0 vs V7-S1"
          echo "=================================================="


          echo
          echo "V7-S0 SUMMARY:"
          echo "--------------------------------------------------"

          if [ -f v7_survival_summary.csv ]; then

            cat v7_survival_summary.csv

          else

            echo "NOT FOUND"

          fi


          echo
          echo
          echo "V7-S1 SUMMARY:"
          echo "--------------------------------------------------"

          if [ -f v7_s1_summary.csv ]; then

            cat v7_s1_summary.csv

          else

            echo "NOT FOUND"

          fi


          echo
          echo
          echo "=================================================="
          echo "TRADE COUNT CHECK"
          echo "=================================================="

          if [ -f v7_survival_results.csv ] && \
             [ -f v7_s1_results.csv ]; then

            echo
            echo "V7-S0 total rows:"
            wc -l v7_survival_results.csv

            echo
            echo "V7-S1 total rows:"
            wc -l v7_s1_results.csv

            echo
            echo "NOTE:"
            echo "S1 is a restrictive filter on S0."
            echo "Therefore S1 must not create additional trades"
            echo "for an identical window/capital configuration."

          else

            echo
            echo "Cannot perform trade-count check."

          fi


      # ==========================================================
      # V6-C RESULTS
      # ==========================================================

      - name: Show V6-C results

        if: always()

        run: |

          echo
          echo "=================================================="
          echo "V6-C RESULTS"
          echo "=================================================="


          for file in \
            logs/v6_walk_forward_summary.csv \
            logs/v6_c_stress_test_summary.csv \
            logs/v6_c_stress_test_asset_summary.csv \
            logs/v6_c_stress_test_ranking.csv \
            logs/v6_c_monte_carlo_summary.csv \
            logs/v6_c_monte_carlo_window_results.csv

          do

            if [ -f "$file" ]; then

              echo
              echo "=================================================="
              echo "FILE: $file"
              echo "=================================================="

              cat "$file"

            fi

          done


      # ==========================================================
      # FINAL DATA / RESULT REPORT
      # ==========================================================

      - name: Final data result report

        if: always()

        run: |

          echo
          echo "=================================================="
          echo "FINAL DATA / RESULT REPORT"
          echo "=================================================="


          echo
          echo "REPOSITORY:"
          echo "--------------------------------------------------"

          find . \
            -maxdepth 3 \
            -type f \
            -not -path "./.git/*" \
            | sort


          echo
          echo
          echo "=================================================="
          echo "DATA FILES"
          echo "=================================================="


          for file in \
            data/BTC_USDT_5m.csv \
            data/ETH_USDT_5m.csv \
            data/SOL_USDT_5m.csv

          do

            echo
            echo "----------------------------------------"
            echo "$file"
            echo "----------------------------------------"

            if [ -f "$file" ]; then

              ls -lh "$file"

              echo

              echo "Rows:"

              wc -l "$file"

            else

              echo "MISSING"

            fi

          done


          echo
          echo
          echo "=================================================="
          echo "CSV RESULTS"
          echo "=================================================="


          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.csv" \
              -o -name "*.json" \
              -o -name "*.txt" \
            \) \
            -not -path "./.git/*" \
            -print \
            | sort


          echo
          echo
          echo "=================================================="
          echo "V7-S0 SUMMARY"
          echo "=================================================="

          if [ -f v7_survival_summary.csv ]; then

            cat v7_survival_summary.csv

          else

            echo "NOT FOUND"

          fi


          echo
          echo
          echo "=================================================="
          echo "V7-S1 SUMMARY"
          echo "=================================================="

          if [ -f v7_s1_summary.csv ]; then

            cat v7_s1_summary.csv

          else

            echo "NOT FOUND"

          fi


      # ==========================================================
      # UPLOAD RESULTS
      # ==========================================================

      - name: Upload backtest results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: 20to100-backtest-results

          path: |

            data/

            logs/

            v7_survival_results.csv
            v7_survival_summary.csv

            v7_s1_results.csv
            v7_s1_summary.csv

          if-no-files-found: warn

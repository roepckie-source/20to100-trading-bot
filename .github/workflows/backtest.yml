name: 20to100 Backtest

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:

  backtest:

    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            ccxt


      # ============================================================
      # DIRECTORY SETUP
      # ============================================================

      - name: Prepare directories
        run: |
          mkdir -p data
          mkdir -p logs
          mkdir -p results


      # ============================================================
      # SHOW REPOSITORY
      # ============================================================

      - name: Show repository files
        run: |
          echo "=================================================="
          echo "REPOSITORY FILES"
          echo "=================================================="

          find . -maxdepth 3 -type f | sort


      # ============================================================
      # DOWNLOAD HISTORICAL DATA
      #
      # Binance Public Data
      #
      # Daily archives are used intentionally.
      # This avoids the monthly archive problem around
      # the current month.
      # ============================================================

      - name: Download BTC ETH SOL 5m data
        run: |
          python download_data.py


      # ============================================================
      # VERIFY DATA
      # ============================================================

      - name: Verify downloaded data
        run: |

          echo "=================================================="
          echo "DATA VERIFICATION"
          echo "=================================================="

          for file in \
            data/BTC_USDT_5m.csv \
            data/ETH_USDT_5m.csv \
            data/SOL_USDT_5m.csv
          do

            echo
            echo "FILE: $file"

            if [ ! -f "$file" ]; then
              echo "❌ MISSING: $file"
              exit 1
            fi

            echo "Size:"
            ls -lh "$file"

            echo "Rows:"
            wc -l "$file"

            echo "First rows:"
            head -3 "$file"

            echo "Last rows:"
            tail -3 "$file"

          done

          echo
          echo "=================================================="
          echo "DATA CHECK COMPLETE"
          echo "=================================================="


      # ============================================================
      # V6 BASELINE
      # ============================================================

      - name: Run V6 backtest
        run: |

          echo "=================================================="
          echo "RUNNING V6 BASELINE"
          echo "=================================================="

          python v6_backtest.py


      # ============================================================
      # V6-C STRESS TEST
      #
      # IMPORTANT:
      # The actual repository filename is:
      #
      # v6_c_stress_test.py
      #
      # NOT:
      #
      # v6_c_stress.py
      # ============================================================

      - name: Run V6-C stress test
        run: |

          echo "=================================================="
          echo "RUNNING V6-C STRESS TEST"
          echo "=================================================="

          python v6_c_stress_test.py


      # ============================================================
      # V6-C MONTE CARLO
      # ============================================================

      - name: Run V6-C Monte Carlo
        run: |

          echo "=================================================="
          echo "RUNNING V6-C MONTE CARLO"
          echo "=================================================="

          python v6_c_monte_carlo.py


      # ============================================================
      # V7-S0 SURVIVAL BACKTEST
      # ============================================================

      - name: Run V7-S0 survival backtest
        run: |

          echo "=================================================="
          echo "RUNNING V7-S0 SURVIVAL BACKTEST"
          echo "=================================================="

          python v7_survival_backtest.py


      # ============================================================
      # V7-S1
      #
      # V6-C entry
      # +
      # survival engine
      # +
      # 0.10 ATR breakout quality filter
      # ============================================================

      - name: Run V7-S1 backtest
        run: |

          echo "=================================================="
          echo "RUNNING V7-S1 BACKTEST"
          echo "=================================================="

          python v7_s1_backtest.py


      # ============================================================
      # RESULT CHECK
      # ============================================================

      - name: Show results
        if: always()
        run: |

          echo
          echo "=================================================="
          echo "FINAL DATA / RESULT REPORT"
          echo "=================================================="

          echo
          echo "Repository:"
          find . -maxdepth 2 -type f | sort

          echo
          echo "=================================================="
          echo "DATA FILES"
          echo "=================================================="

          for file in \
            data/BTC_USDT_5m.csv \
            data/ETH_USDT_5m.csv \
            data/SOL_USDT_5m.csv
          do

            echo
            echo "----------------------------------------"
            echo "$file"
            echo "----------------------------------------"

            if [ -f "$file" ]; then
              ls -lh "$file"
              echo "Rows:"
              wc -l "$file"
            else
              echo "MISSING"
            fi

          done

          echo
          echo "=================================================="
          echo "CSV RESULTS"
          echo "=================================================="

          find . \
            -maxdepth 3 \
            -type f \
            \( -name "*.csv" -o -name "*.json" -o -name "*.txt" \) \
            -print | sort


      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            data/*.csv
            results/**
            logs/**
            *_results.csv
            *_summary.csv
          if-no-files-found: warn
          retention-days: 30

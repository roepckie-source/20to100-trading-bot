name: 20to100 Backtest

on:
  workflow_dispatch:

jobs:

  backtest:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # ORIGINAL BACKTEST
      # ------------------------------------------------------

      - name: Run original A-B-C backtest
        run: |
          echo "=============================================="
          echo "RUNNING ORIGINAL A/B/C BACKTEST"
          echo "=============================================="
          python main.py


      # ------------------------------------------------------
      # V2.1 BACKTEST
      # ------------------------------------------------------

      - name: Run V2.1 backtest
        run: |
          echo ""
          echo "=============================================="
          echo "RUNNING V2.1 DONCHIAN + EMA200 + ATR"
          echo "=============================================="
          python v2_backtest.py


      # ------------------------------------------------------
      # UPLOAD RESULTS
      # ------------------------------------------------------

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            logs/
          if-no-files-found: ignore

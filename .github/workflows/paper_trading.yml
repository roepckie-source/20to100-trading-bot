name: 20to100 Paper Trading

on:
  workflow_dispatch:

permissions:
  contents: write

# Verhindert parallele Paper-Trading-Sessions
concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest

    # 6 Stunden maximale Laufzeit
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. PAPER STATE
      # ============================================================
      - name: Prepare paper state
        run: |
          echo "=================================================="
          echo "V7-S0 CONTINUOUS PAPER TRADING"
          echo "=================================================="

          mkdir -p paper_logs

          echo
          echo "Existing paper state:"
          find paper_logs -maxdepth 1 -type f -print | sort || true

      # ============================================================
      # 5. SAFETY CHECK
      # ============================================================
      - name: Safety check
        run: |
          python - <<'PY'
          import config_paper

          print("==================================================")
          print("PAPER TRADING SAFETY CHECK")
          print("==================================================")

          assert config_paper.LIVE_TRADING is False, \
              "SAFETY ERROR: LIVE_TRADING MUST BE FALSE"

          assert config_paper.VARIANT == "V6_C", \
              "SAFETY ERROR: Unexpected strategy variant"

          assert config_paper.OHLCV_LIMIT >= 5000, \
              "SAFETY ERROR: OHLCV history too small"

          print("Exchange      :", config_paper.PAPER_EXCHANGE)
          print("Symbols       :", config_paper.SYMBOLS)
          print("Variant       :", config_paper.VARIANT)
          print("Starting cash :", config_paper.STARTING_CAPITAL)
          print("OHLCV limit   :", config_paper.OHLCV_LIMIT)
          print("Live trading  :", config_paper.LIVE_TRADING)
          print("Leverage      : NONE")
          print("Loop interval : 5 minutes")
          print("Session limit : 6 hours")

          print()
          print("SAFETY CHECK PASSED")
          PY

      # ============================================================
      # 6. CONTINUOUS PAPER TRADING
      # ============================================================
      - name: Run continuous paper trading
        run: |
          echo "=================================================="
          echo "STARTING CONTINUOUS V7-S0 PAPER TRADING"
          echo "=================================================="
          echo
          echo "One paper run every 5 minutes."
          echo "No live trading."
          echo "Session duration: 6 hours."
          echo

          END_TIME=$(( $(date +%s) + 21600 ))

          RUN_NUMBER=0

          while [ "$(date +%s)" -lt "$END_TIME" ]; do

            RUN_NUMBER=$((RUN_NUMBER + 1))

            echo
            echo "=================================================="
            echo "PAPER ITERATION #$RUN_NUMBER"
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "=================================================="

            python run_paper.py --once

            echo
            echo "Iteration #$RUN_NUMBER complete."

            NOW=$(date +%s)

            if [ "$NOW" -ge "$END_TIME" ]; then
              break
            fi

            echo
            echo "Waiting 5 minutes until next paper iteration..."
            sleep 300

          done

          echo
          echo "=================================================="
          echo "6-HOUR PAPER SESSION COMPLETE"
          echo "=================================================="

      # ============================================================
      # 7. SHOW FINAL STATE
      # ============================================================
      - name: Show paper state
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "FINAL PAPER STATE"
          echo "=================================================="

          for file in \
            paper_logs/BTC_USDT_paper_state.json \
            paper_logs/ETH_USDT_paper_state.json \
            paper_logs/SOL_USDT_paper_state.json
          do
            echo
            echo "--------------------------------------------------"
            echo "$file"
            echo "--------------------------------------------------"

            if [ -f "$file" ]; then
              cat "$file"
            else
              echo "FILE NOT FOUND"
            fi
          done

      # ============================================================
      # 8. EQUITY HISTORY
      # ============================================================
      - name: Show equity history
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "EQUITY HISTORY"
          echo "=================================================="

          if [ -f paper_logs/paper_equity.csv ]; then
            echo "Rows:"
            wc -l paper_logs/paper_equity.csv

            echo
            echo "Last 20 entries:"
            tail -n 20 paper_logs/paper_equity.csv
          else
            echo "No equity file found."
          fi

      # ============================================================
      # 9. SHOW SIGNAL HISTORY
      # ============================================================
      - name: Show signal history
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "SIGNAL HISTORY"
          echo "=================================================="

          if [ -f paper_logs/paper_signals.csv ]; then
            echo "Rows:"
            wc -l paper_logs/paper_signals.csv

            echo
            echo "Last 20 signals:"
            tail -n 20 paper_logs/paper_signals.csv
          else
            echo "No signal file found."
          fi

      # ============================================================
      # 10. SAVE STATE TO GITHUB
      # ============================================================
      - name: Commit paper trading data
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "SAVING PAPER TRADING DATA"
          echo "=================================================="

          git config user.name "20to100 Paper Trading Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_logs/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update continuous paper trading state"
            git push
            echo "Paper trading state saved."
          fi

      # ============================================================
      # 11. FINAL STATUS
      # ============================================================
      - name: Final status
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "V7-S0 CONTINUOUS PAPER TRADING COMPLETE"
          echo "=================================================="

          git status --short

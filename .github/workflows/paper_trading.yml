name: 20to100 Paper Trading

on:
  workflow_dispatch:

  # ============================================================
  # AUTOMATISCH ALLE 5 MINUTEN
  # ============================================================
  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: write

# Verhindert parallele Läufe
concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. PAPER STATE
      # ============================================================
      - name: Prepare paper state
        run: |
          echo "=================================================="
          echo "PAPER TRADING STATE"
          echo "=================================================="

          mkdir -p paper_logs

          echo
          echo "Existing files:"

          find paper_logs -maxdepth 1 -type f -print | sort || true

      # ============================================================
      # 5. SAFETY CHECK
      # ============================================================
      - name: Safety check
        run: |
          python - <<'PY'
          import config_paper

          print("==================================================")
          print("PAPER TRADING SAFETY CHECK")
          print("==================================================")

          assert config_paper.LIVE_TRADING is False, \
              "SAFETY ERROR: LIVE_TRADING MUST BE FALSE"

          assert config_paper.VARIANT == "V6_C", \
              "SAFETY ERROR: Unexpected strategy variant"

          assert config_paper.OHLCV_LIMIT >= 5000, \
              "SAFETY ERROR: OHLCV history too small"

          print("Exchange      :", config_paper.PAPER_EXCHANGE)
          print("Symbols       :", config_paper.SYMBOLS)
          print("Variant       :", config_paper.VARIANT)
          print("Starting cash :", config_paper.STARTING_CAPITAL)
          print("OHLCV limit   :", config_paper.OHLCV_LIMIT)
          print("Live trading  :", config_paper.LIVE_TRADING)
          print("Leverage      : NONE")

          print()
          print("SAFETY CHECK PASSED")
          PY

      # ============================================================
      # 6. RUN PAPER TRADING
      # ============================================================
      - name: Run paper trading
        run: |
          echo "=================================================="
          echo "RUNNING V7-S0 PAPER TRADING"
          echo "=================================================="

          python run_paper.py --once

      # ============================================================
      # 7. SHOW STATE
      # ============================================================
      - name: Show paper state
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "CURRENT PAPER STATE"
          echo "=================================================="

          for file in \
            paper_logs/BTC_USDT_paper_state.json \
            paper_logs/ETH_USDT_paper_state.json \
            paper_logs/SOL_USDT_paper_state.json
          do
            echo
            echo "--------------------------------------------------"
            echo "$file"
            echo "--------------------------------------------------"

            if [ -f "$file" ]; then
              cat "$file"
            else
              echo "FILE NOT FOUND"
            fi
          done

      # ============================================================
      # 8. EQUITY HISTORY
      # ============================================================
      - name: Show equity history
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "EQUITY HISTORY"
          echo "=================================================="

          if [ -f paper_logs/paper_equity.csv ]; then
            echo "Rows:"
            wc -l paper_logs/paper_equity.csv

            echo
            echo "Last 10 entries:"
            tail -n 10 paper_logs/paper_equity.csv
          else
            echo "No equity file found."
          fi

      # ============================================================
      # 9. SAVE STATE TO GITHUB
      # ============================================================
      - name: Commit paper trading data
        if: success()
        run: |
          echo
          echo "=================================================="
          echo "SAVING PAPER TRADING DATA"
          echo "=================================================="

          git config user.name "20to100 Paper Trading Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_logs/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update paper trading state"
            git push
            echo "Paper trading state saved."
          fi

      # ============================================================
      # 10. FINAL STATUS
      # ============================================================
      - name: Final status
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "V7-S0 PAPER TRADING RUN COMPLETE"
          echo "=================================================="

          git status --short

name: 20to100 Paper Trading

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. RESTORE PAPER STATE
      # ============================================================
      - name: Restore paper trading state
        run: |
          echo "=================================================="
          echo "RESTORING PAPER TRADING STATE"
          echo "=================================================="

          mkdir -p paper_logs

          if [ -f paper_logs/BTC_USDT_paper_state.json ]; then
            echo "BTC state found"
          else
            echo "BTC state not found - starting fresh"
          fi

          if [ -f paper_logs/ETH_USDT_paper_state.json ]; then
            echo "ETH state found"
          else
            echo "ETH state not found - starting fresh"
          fi

          if [ -f paper_logs/SOL_USDT_paper_state.json ]; then
            echo "SOL state found"
          else
            echo "SOL state not found - starting fresh"
          fi

          if [ -f paper_logs/paper_equity.csv ]; then
            echo "Equity history found"
          else
            echo "Equity history not found - starting fresh"
          fi

      # ============================================================
      # 5. SAFETY CHECK
      # ============================================================
      - name: Safety check
        run: |
          python - <<'PY'
          import config_paper

          print("==================================================")
          print("PAPER TRADING SAFETY CHECK")
          print("==================================================")

          assert config_paper.LIVE_TRADING is False, \
              "LIVE_TRADING MUST BE FALSE"

          assert config_paper.VARIANT == "V6_C", \
              "Unexpected strategy variant"

          assert config_paper.OHLCV_LIMIT >= 5000, \
              "OHLCV history too small"

          print("LIVE_TRADING =", config_paper.LIVE_TRADING)
          print("VARIANT       =", config_paper.VARIANT)
          print("OHLCV_LIMIT   =", config_paper.OHLCV_LIMIT)
          print("SAFETY CHECK PASSED")
          PY

      # ============================================================
      # 6. RUN PAPER TRADING
      # ============================================================
      - name: Run paper trading
        run: |
          python run_paper.py --once

      # ============================================================
      # 7. SHOW STATE
      # ============================================================
      - name: Show paper trading state
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "PAPER TRADING STATE"
          echo "=================================================="

          find paper_logs -maxdepth 1 -type f -print | sort

          echo
          echo "--------------------------------------------------"
          echo "BTC STATE"
          echo "--------------------------------------------------"

          if [ -f paper_logs/BTC_USDT_paper_state.json ]; then
            cat paper_logs/BTC_USDT_paper_state.json
          fi

          echo
          echo "--------------------------------------------------"
          echo "ETH STATE"
          echo "--------------------------------------------------"

          if [ -f paper_logs/ETH_USDT_paper_state.json ]; then
            cat paper_logs/ETH_USDT_paper_state.json
          fi

          echo
          echo "--------------------------------------------------"
          echo "SOL STATE"
          echo "--------------------------------------------------"

          if [ -f paper_logs/SOL_USDT_paper_state.json ]; then
            cat paper_logs/SOL_USDT_paper_state.json
          fi

      # ============================================================
      # 8. COMMIT PAPER DATA
      # ============================================================
      - name: Commit paper trading data
        if: success()
        run: |
          echo "=================================================="
          echo "SAVING PAPER TRADING DATA"
          echo "=================================================="

          git config user.name "20to100 Paper Trading Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_logs/

          if git diff --cached --quiet; then
            echo "No paper trading changes to commit."
          else
            git commit -m "Update paper trading state"
            git push
          fi

      # ============================================================
      # 9. FINAL STATUS
      # ============================================================
      - name: Final status
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "PAPER TRADING WORKFLOW COMPLETE"
          echo "=================================================="

          git status --short

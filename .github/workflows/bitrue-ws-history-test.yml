name: Bitrue WebSocket History Test

on:
  workflow_dispatch:

jobs:
  download-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websocket-client

      - name: Download 1 day of BTC/USDT 5m history
        env:
          BITRUE_DAYS: "1"
        run: |
          python bitrue/download_history_ws.py

      - name: Show CSV information
        run: |
          echo "===== FILE ====="
          ls -lh BTCUSDT_5m.csv

          echo ""
          echo "===== LINE COUNT ====="
          wc -l BTCUSDT_5m.csv

          echo ""
          echo "===== FIRST 5 ROWS ====="
          head -5 BTCUSDT_5m.csv

          echo ""
          echo "===== LAST 5 ROWS ====="
          tail -5 BTCUSDT_5m.csv

      - name: Upload dataset
        uses: actions/upload-artifact@v4
        with:
          name: bitrue-btcusdt-5m-ws-1d
          path: BTCUSDT_5m.csv
          if-no-files-found: error

name: Bitrue V6 - Cost & Edge Test

on:
  workflow_dispatch:

jobs:
  v6:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests


      # ============================================================
      # DOWNLOAD HISTORICAL DATA
      # ============================================================

      - name: Download 365 days BTCUSDT 5m
        env:
          BITRUE_DAYS: "365"
        run: |
          echo
          echo "============================================================"
          echo "DOWNLOAD BTCUSDT 5m HISTORICAL DATA"
          echo "============================================================"
          echo

          python bitrue/download_binance_data.py


      # ============================================================
      # DATASET VALIDATION
      # ============================================================

      - name: Validate dataset
        run: |
          echo
          echo "============================================================"
          echo "VALIDATE BTCUSDT DATASET"
          echo "============================================================"
          echo

          if [ ! -f BTCUSDT_5m.csv ]; then
            echo "ERROR: BTCUSDT_5m.csv fehlt."
            exit 1
          fi

          ls -lh BTCUSDT_5m.csv

          echo
          echo "Anzahl Zeilen:"
          wc -l BTCUSDT_5m.csv

          echo
          echo "Erste 5 Zeilen:"
          head -5 BTCUSDT_5m.csv

          echo
          echo "Letzte 5 Zeilen:"
          tail -5 BTCUSDT_5m.csv


      # ============================================================
      # V5 DIRECTION TEST
      # ============================================================

      - name: Run V5 Direction Test
        run: |
          echo
          echo "============================================================"
          echo "BITRUE V5 DIRECTION TEST"
          echo "============================================================"
          echo
          echo "LONG ONLY"
          echo "SHORT ONLY"
          echo "BOTH"
          echo
          echo "V5 PARAMETERS:"
          echo "  ATR:       0.175% - 0.200%"
          echo "  Volume:    1.2x - 3.0x"
          echo "  SL:        1.4x ATR"
          echo "  TP:        2.5x ATR"
          echo "  Cooldown:  30 Minuten"
          echo
          echo "PAPER ONLY"
          echo "NO LIVE TRADING"
          echo "NO API KEYS"
          echo "NO WALLET"
          echo "NO REAL ORDERS"
          echo

          python bitrue/v5_direction_test.py


      # ============================================================
      # VERIFY V5 FILES
      # ============================================================

      - name: Verify V5 trade files
        run: |
          echo
          echo "============================================================"
          echo "ÜBERPRÜFE V5-HANDELSDATEIEN"
          echo "============================================================"
          echo

          FAILED=0

          for file in \
            bitrue_v5_long_only_trades.csv \
            bitrue_v5_short_only_trades.csv \
            bitrue_v5_both_trades.csv
          do

            if [ ! -f "$file" ]; then
              echo "FEHLER: Fehlende $file"
              FAILED=1
            else
              echo "OK: $file"
              wc -l "$file"
              echo
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "FEHLER: Eine oder mehrere V5-Handelsdateien fehlen."
            exit 1
          fi

          echo
          echo "ALLE V5-HANDELSDATEIEN VORHANDEN."


      # ============================================================
      # SHOW V5 RESULTS
      # ============================================================

      - name: Show V5 results
        run: |
          echo
          echo "============================================================"
          echo "V5 RESULTS"
          echo "============================================================"
          echo

          if [ -f bitrue_v5_direction_report.txt ]; then
            cat bitrue_v5_direction_report.txt
          else
            echo "WARNUNG: bitrue_v5_direction_report.txt fehlt."
          fi


      # ============================================================
      # V6 COST & EDGE TEST
      # ============================================================

      - name: Run V6 Cost & Edge Test
        run: |
          echo
          echo "============================================================"
          echo "BITRUE V6"
          echo "COST & EDGE TEST"
          echo "============================================================"
          echo

          echo "V6 testet KEINE neuen Strategieparameter."
          echo
          echo "Es wird untersucht:"
          echo "  - Brutto Edge"
          echo "  - Gebühren"
          echo "  - Slippage"
          echo "  - Break-even Fee"
          echo "  - Break-even Slippage"
          echo "  - kombinierte Kosten"
          echo
          echo "PAPER ONLY"
          echo "NO LIVE TRADING"
          echo "NO API KEYS"
          echo "NO WALLET"
          echo "NO REAL ORDERS"
          echo

          python bitrue/v6_cost_edge_test.py


      # ============================================================
      # SHOW V6 SUMMARY
      # ============================================================

      - name: Show V6 summary
        run: |
          echo
          echo "============================================================"
          echo "V6 COST & EDGE SUMMARY"
          echo "============================================================"
          echo

          if [ -f bitrue_v6_cost_edge_summary.csv ]; then
            cat bitrue_v6_cost_edge_summary.csv
          else
            echo "ERROR: bitrue_v6_cost_edge_summary.csv fehlt."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "FEE SENSITIVITY"
          echo "============================================================"
          echo

          if [ -f bitrue_v6_fee_sensitivity.csv ]; then
            cat bitrue_v6_fee_sensitivity.csv
          fi

          echo
          echo "============================================================"
          echo "SLIPPAGE SENSITIVITY"
          echo "============================================================"
          echo

          if [ -f bitrue_v6_slippage_sensitivity.csv ]; then
            cat bitrue_v6_slippage_sensitivity.csv
          fi

          echo
          echo "============================================================"
          echo "COMBINED COST SENSITIVITY"
          echo "============================================================"
          echo

          if [ -f bitrue_v6_combined_cost_sensitivity.csv ]; then
            cat bitrue_v6_combined_cost_sensitivity.csv
          fi


      # ============================================================
      # UPLOAD V5 RESULTS
      # ============================================================

      - name: Upload V5 trade files
        uses: actions/upload-artifact@v4
        with:
          name: bitrue-v5-direction-results
          path: |
            bitrue_v5_long_only_trades.csv
            bitrue_v5_short_only_trades.csv
            bitrue_v5_both_trades.csv
            bitrue_v5_direction_report.txt
            bitrue_v5_direction_summary.csv
          if-no-files-found: error


      # ============================================================
      # UPLOAD V6 RESULTS
      # ============================================================

      - name: Upload V6 cost edge results
        uses: actions/upload-artifact@v4
        with:
          name: bitrue-v6-cost-edge-results
          path: |
            bitrue_v6_cost_edge_summary.csv
            bitrue_v6_fee_sensitivity.csv
            bitrue_v6_slippage_sensitivity.csv
            bitrue_v6_combined_cost_sensitivity.csv
          if-no-files-found: error


      # ============================================================
      # FINAL
      # ============================================================

      - name: Final summary
        run: |
          echo
          echo "============================================================"
          echo "BITRUE V6 COST & EDGE TEST COMPLETE"
          echo "============================================================"
          echo

          echo "DATEN:"
          echo "  BTCUSDT"
          echo "  5 Minuten"
          echo "  365 Tage"
          echo

          echo "V5:"
          echo "  LONG ONLY"
          echo "  SHORT ONLY"
          echo "  BOTH"
          echo

          echo "V6:"
          echo "  Cost & Edge Test"
          echo "  Fee Sensitivity"
          echo "  Slippage Sensitivity"
          echo "  Combined Cost Sensitivity"
          echo

          echo "SICHERHEIT:"
          echo "  PAPER ONLY"
          echo "  KEIN LIVE TRADING"
          echo "  KEINE API KEYS"
          echo "  KEIN WALLET"
          echo "  KEINE REALEN ORDERS"
          echo

          echo "============================================================"

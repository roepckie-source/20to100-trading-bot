name: V7-S0 Recent 90-Day Replay

on:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  v7-recent-replay:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==================================================
      # INSTALL
      # ==================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            pandas \
            numpy \
            requests \
            ccxt


      # ==================================================
      # SAFETY CHECK
      # ==================================================

      - name: Safety check
        shell: bash

        run: |

          set -u

          echo "=================================================="
          echo "V7-S0 RECENT REPLAY SAFETY CHECK"
          echo "=================================================="

          echo
          echo "NO LIVE TRADING."
          echo "NO EXCHANGE API KEYS."
          echo "NO REAL ORDERS."

          echo
          echo "Checking required files..."
          echo

          FAILED=0

          check_file() {

            FILE="$1"

            if [ -f "$FILE" ]; then

              echo "PASS: $FILE"

            else

              echo "FAIL: $FILE"

              FAILED=1

            fi

          }

          # ------------------------------------------------
          # PYTHON FILES
          # ------------------------------------------------

          check_file "v7_recent_replay.py"

          check_file "backtest/v7_survival_engine.py"

          check_file "strategy/strategy_v6.py"

          check_file "strategy/indicators.py"

          # ------------------------------------------------
          # DATA FILES
          # ------------------------------------------------

          check_file "data/BTC_USDT_5m.csv"

          check_file "data/ETH_USDT_5m.csv"

          check_file "data/SOL_USDT_5m.csv"

          echo
          echo "=================================================="

          if [ "$FAILED" -ne 0 ]; then

            echo "SAFETY CHECK FAILED"

            echo

            echo "Repository tree:"

            echo

            find . \
              -maxdepth 4 \
              -type f \
              | sort

            echo

            echo "=================================================="

            exit 1

          fi

          echo "ALL REQUIRED FILES FOUND"

          echo "SAFETY CHECK PASSED"

          echo "=================================================="


      # ==================================================
      # ENGINE API CHECK
      # ==================================================

      - name: Check V7-S0 engine API
        run: |

          python - <<'PY'

          import inspect

          from backtest.v7_survival_engine import V7SurvivalEngine

          print("V7-S0 ENGINE SIGNATURE")
          print("======================")

          print(
              inspect.signature(
                  V7SurvivalEngine
              )
          )

          signature = inspect.signature(
              V7SurvivalEngine
          )

          if "base_risk_per_trade" not in signature.parameters:

              raise SystemExit(
                  "ERROR: base_risk_per_trade missing"
              )

          print()
          print(
              "PASS: base_risk_per_trade exists"
          )

          PY


      # ==================================================
      # RUN REPLAY
      # ==================================================

      - name: Run V7-S0 90-day replay
        shell: bash

        run: |

          set -o pipefail

          python -u v7_recent_replay.py \
            | tee v7_recent_replay.log


      # ==================================================
      # VERIFY RESULT
      # ==================================================

      - name: Verify result CSV
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING RESULT"
          echo "=================================================="

          if [ ! -f "v7_recent_replay_results.csv" ]; then

            echo
            echo "ERROR:"
            echo "NO RESULT CSV PRODUCED."

            exit 1

          fi

          echo
          echo "Result file exists."

          echo
          echo "CSV:"
          echo

          cat v7_recent_replay_results.csv

          echo
          echo "=================================================="


      # ==================================================
      # RESULT COUNT
      # ==================================================

      - name: Validate result count
        shell: bash

        run: |

          python - <<'PY'

          import pandas as pd

          file = "v7_recent_replay_results.csv"

          df = pd.read_csv(file)

          print()
          print("RESULT COUNT")
          print("============")

          print(
              f"Rows: {len(df)}"
          )

          expected = 12

          if len(df) != expected:

              raise SystemExit(
                  f"ERROR: expected {expected} "
                  f"results but got {len(df)}"
              )

          print(
              "PASS: 12 result rows found"
          )

          print()
          print(
              df[
                  [
                      "asset",
                      "starting_capital",
                      "final_balance",
                      "return_pct",
                      "trades",
                      "profit_factor",
                      "max_drawdown_pct",
                      "kill_switch",
                  ]
              ].to_string(
                  index=False
              )
          )

          PY


      # ==================================================
      # UPLOAD RESULTS
      # ==================================================

      - name: Upload replay results
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: v7-s0-recent-replay

          path: |

            v7_recent_replay_results.csv

            v7_recent_replay.log

          if-no-files-found: warn

name: BTC Funding Arbitrage Paper Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    env:

      BITRUE_API_KEY: ${{ secrets.BITRUE_API_KEY }}
      BITRUE_API_SECRET: ${{ secrets.BITRUE_API_SECRET }}

      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
      OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}

      MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
      MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}


    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install dependencies

        run: |

          pip install -r requirements.txt


      - name: PAPER SCAN ONLY

        run: |

          python main.py
